<style>

<body>
<div id="game"></div>

<div id="top">
  <div class="panel">
    <div id="title">🧱 CLASSROOM SANDBOX</div>
    <div id="status">Loading textured world...</div>
  </div>
  <button id="fullscreen">⛶ FULLSCREEN</button>
</div>

<div id="palette"></div>

<div id="movement">
  <button id="forward" data-move="forward">▲</button>
  <button id="left" data-move="left">◀</button>
  <button id="backward" data-move="backward">▼</button>
  <button id="right" data-move="right">▶</button>
</div>

<button id="jump" data-move="jump">JUMP ↑</button>

<div id="tools">
  <button id="remove">⛏ REMOVE</button>
  <button id="place">＋ PLACE</button>
</div>

<div id="lookHint">Tap or click to look around</div>

<div id="help" class="panel">
  Computer: WASD to move · Mouse to look<br>
  Left-click: remove block · Right-click: place<br>
  Choose a block from the palette.<br>
  Press Esc to release the mouse.
</div>

<script src="./three.min.js"></script>
<script>
(() => {
  const status = document.getElementById("status");
  const hint = document.getElementById("lookHint");

  if (!window.THREE) {
    status.textContent =
      "Missing three.min.js — upload it beside index.html.";
    hint.textContent = "3D engine not found";
    return;
  }

  const THREE = window.THREE;

  // --------------------------------------------------
  // WORLD AND CAMERA
  // --------------------------------------------------

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8bd5ff);
  scene.fog = new THREE.Fog(0x8bd5ff, 25, 70);

  const camera = new THREE.PerspectiveCamera(
    75, innerWidth / innerHeight, 0.1, 1000
  );
  camera.rotation.order = "YXZ";
  camera.position.set(8, 5, 12);

  const renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "default"
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  if ("outputColorSpace" in renderer) {
    renderer.outputColorSpace = THREE.SRGBColorSpace;
  }

  document.getElementById("game").appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x64794d, 2));

  const sun = new THREE.DirectionalLight(0xffffff, 2);
  sun.position.set(12, 24, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun);

  // --------------------------------------------------
  // ORIGINAL PIXEL-ART TEXTURE GENERATOR
  // No external texture files are required.
  // --------------------------------------------------

  function makeTexture(type) {
    const size = 32;
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;

    const ctx = canvas.getContext("2d");

    function fill(color) {
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, size, size);
    }

    // Fixed seed gives consistent textures.
    let seed = ({
      grass: 1234, dirt: 2345, stone: 3456,
      sand: 4567, wood: 5678, leaves: 6789
    })[type] || 1111;

    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    function flecks(colors, count, minSize, maxSize) {
      for (let i = 0; i < count; i++) {
        ctx.fillStyle = colors[
          Math.floor(random() * colors.length)
        ];

        const w = minSize +
          Math.floor(random() * (maxSize - minSize + 1));
        const h = minSize +
          Math.floor(random() * (maxSize - minSize + 1));

        ctx.fillRect(
          Math.floor(random() * size),
          Math.floor(random() * size),
          w, h
        );
      }
    }

    if (type === "grass") {
      fill("#64b83e");
      flecks(
        ["#4c9d31", "#75c84a", "#8bd45a", "#529c32"],
        110, 1, 3
      );
    }

    if (type === "dirt") {
      fill("#936039");
      flecks(
        ["#754729", "#ad7849", "#80502f", "#b38252"],
        125, 1, 4
      );
    }

    if (type === "stone") {
      fill("#8d969e");
      flecks(
        ["#737c84", "#aab1b7", "#818990", "#686f77"],
        115, 1, 4
      );
    }

    if (type === "sand") {
      fill("#e7d18b");
      flecks(
        ["#d8bd70", "#f3e2a5", "#c9b36e", "#edda98"],
        105, 1, 3
      );
    }

    if (type === "wood") {
      fill("#98602f");

      for (let x = 2; x < size; x += 6) {
        ctx.fillStyle = random() > .5 ? "#78451f" : "#b17a40";
        ctx.fillRect(x, 0, 2, size);
      }

      flecks(["#70401f", "#c18a4a"], 28, 1, 2);
    }

    if (type === "leaves") {
      fill("#318440");
      flecks(
        ["#246c32", "#3f9a48", "#57ad4d", "#2b7838"],
        135, 2, 5
      );
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    texture.generateMipmaps = false;

    if ("colorSpace" in texture) {
      texture.colorSpace = THREE.SRGBColorSpace;
    }

    return texture;
  }

  const textures = {
    grass: makeTexture("grass"),
    dirt: makeTexture("dirt"),
    stone: makeTexture("stone"),
    sand: makeTexture("sand"),
    wood: makeTexture("wood"),
    leaves: makeTexture("leaves")
  };

  function material(texture) {
    return new THREE.MeshLambertMaterial({ map: texture });
  }

  const materials = {
    grassTop: material(textures.grass),
    grassSide: material(textures.grass),
    dirt: material(textures.dirt),
    stone: material(textures.stone),
    sand: material(textures.sand),
    woodSide: material(textures.wood),
    woodEnd: material(textures.wood),
    leaves: material(textures.leaves)
  };

  // Box face order: +X, -X, +Y, -Y, +Z, -Z.
  // Grass has grass on top and dirt beneath the surface.
  const blockMaterials = {
    grass: [
      materials.grassSide,
      materials.grassSide,
      materials.grassTop,
      materials.dirt,
      materials.grassSide,
      materials.grassSide
    ],
    dirt: [
      materials.dirt, materials.dirt,
      materials.dirt, materials.dirt,
      materials.dirt, materials.dirt
    ],
    stone: [
      materials.stone, materials.stone,
      materials.stone, materials.stone,
      materials.stone, materials.stone
    ],
    sand: [
      materials.sand, materials.sand,
      materials.sand, materials.sand,
      materials.sand, materials.sand
    ],
    wood: [
      materials.woodSide, materials.woodSide,
      materials.woodEnd, materials.woodEnd,
      materials.woodSide, materials.woodSide
    ],
    leaves: [
      materials.leaves, materials.leaves,
      materials.leaves, materials.leaves,
      materials.leaves, materials.leaves
    ]
  };

  const blockColors = {
    grass: "#64b83e",
    dirt: "#936039",
    stone: "#8d969e",
    sand: "#e7d18b",
    wood: "#98602f",
    leaves: "#318440"
  };

  const blockIcons = {
    grass: "🌱",
    dirt: "🟫",
    stone: "🪨",
    sand: "🏖️",
    wood: "🪵",
    leaves: "🌿"
  };

  const names = Object.keys(blockMaterials);
  let selected = "grass";

  // --------------------------------------------------
  // BLOCK WORLD
  // --------------------------------------------------

  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const blocks = new Map();
  const blockMeshes = [];

  function keyOf(x, y, z) {
    return `${x},${y},${z}`;
  }

  function addBlock(x, y, z, type) {
    const key = keyOf(x, y, z);

    if (blocks.has(key)) return false;

    if (!blockMaterials[type]) type = "grass";

    const mesh = new THREE.Mesh(geometry, blockMaterials[type]);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData = { x, y, z, type };

    scene.add(mesh);
    blocks.set(key, mesh);
    blockMeshes.push(mesh);

    return true;
  }

  function removeBlock(mesh) {
    if (!mesh || !mesh.userData) return;

    const { x, y, z } = mesh.userData;
    blocks.delete(keyOf(x, y, z));
    scene.remove(mesh);

    const index = blockMeshes.indexOf(mesh);
    if (index !== -1) blockMeshes.splice(index, 1);
  }

  // Generate hills with grass, dirt, and stone layers.
  for (let x = -12; x <= 12; x++) {
    for (let z = -12; z <= 12; z++) {
      const height = Math.round(
        Math.sin(x * 0.38) * 0.7 +
        Math.cos(z * 0.31) * 0.7
      );

      for (let y = -2; y <= height; y++) {
        let type;

        if (y === height) {
          type = height < -0.5 ? "sand" : "grass";
        } else if (y < -1) {
          type = "stone";
        } else {
          type = "dirt";
        }

        addBlock(x, y, z, type);
      }
    }
  }

  // Add simple block trees.
  for (const [tx, tz] of [[-5,-4], [5,3], [8,-7], [-9,5]]) {
    const ground = Math.round(
      Math.sin(tx * 0.38) * 0.7 +
      Math.cos(tz * 0.31) * 0.7
    );

    for (let y = ground + 1; y <= ground + 3; y++) {
      addBlock(tx, y, tz, "wood");
    }

    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        for (let dy = 2; dy <= 4; dy++) {
          if (
            Math.abs(dx) + Math.abs(dz) +
            (dy === 4 ? 1 : 0) < 4
          ) {
            addBlock(tx + dx, ground + dy, tz + dz, "leaves");
          }
        }
      }
    }
  }

  // --------------------------------------------------
  // BLOCK SELECTION PALETTE
  // --------------------------------------------------

  const palette = document.getElementById("palette");

  for (const name of names) {
    const button = document.createElement("button");

    button.className = "swatch" +
      (name === selected ? " selected" : "");

    button.style.backgroundColor = blockColors[name];
    button.textContent = blockIcons[name];
    button.title = name;
    button.setAttribute("aria-label", name);

    // Use the same original generated texture for the icon.
    button.style.backgroundImage =
      `url("${textures[name].image.toDataURL
        ? textures[name].image.toDataURL()
        : ""}")`;

    // A simple colored fallback remains if the texture preview
    // isn't available from the texture source.
    button.onclick = () => {
      selected = name;

      palette.querySelectorAll("button").forEach(b => {
        b.classList.toggle("selected", b === button);
      });

      status.textContent = "Selected block: " + name;
    };

    palette.appendChild(button);
  }

  // --------------------------------------------------
  // BLOCK PLACEMENT AND REMOVAL
  // --------------------------------------------------

  const raycaster = new THREE.Raycaster();
  const center = new THREE.Vector2(0, 0);

  function targetBlock() {
    raycaster.setFromCamera(center, camera);

    const hits = raycaster.intersectObjects(blockMeshes, false);
    return hits.length ? hits[0] : null;
  }

  function mine() {
    const hit = targetBlock();

    if (hit) {
      removeBlock(hit.object);
      status.textContent = "Block removed";
    }
  }

  function build() {
    const hit = targetBlock();
    if (!hit) return;

    const p = hit.object.position.clone().add(hit.face.normal);

    const x = Math.round(p.x);
    const y = Math.round(p.y);
    const z = Math.round(p.z);

    if (y > 20 || y < -3) return;

    // Prevent placing a block inside the camera/player.
    if (
      Math.abs(x - camera.position.x) < 0.8 &&
      Math.abs(z - camera.position.z) < 0.8 &&
      Math.abs(y - camera.position.y) < 1.8
    ) return;

    if (addBlock(x, y, z, selected)) {
      status.textContent = "Placed " + selected;
    }
  }

  // --------------------------------------------------
  // MOVEMENT AND CAMERA CONTROLS
  // --------------------------------------------------

  const keys = {};

  const move = {
    forward: false,
    backward: false,
    left: false,
    right: false,
    jump: false
  };

  let yaw = Math.PI * 0.75;
  let pitch = -0.15;
  let locked = false;
  let lastTouch = null;
  let jumpVelocity = 0;
  let onGround = false;

  function syncCamera() {
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  }

  syncCamera();

  addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (
      ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "]
        .includes(e.key)
    ) {
      e.preventDefault();
    }
  });

  addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
  });

  renderer.domElement.addEventListener("click", () => {
    if (
      matchMedia("(pointer:fine)").matches &&
      renderer.domElement.requestPointerLock
    ) {
      renderer.domElement.requestPointerLock();
    } else {
      hint.textContent = "Drag to look around";
    }
  });

  document.addEventListener("pointerlockchange", () => {
    locked = document.pointerLockElement === renderer.domElement;
    hint.textContent = locked ? "" : "Tap or click to look around";
  });

  document.addEventListener("mousemove", e => {
    if (!locked) return;

    yaw -= e.movementX * 0.0025;
    pitch -= e.movementY * 0.0025;

    pitch = Math.max(-1.45, Math.min(1.45, pitch));
    syncCamera();
  });

  renderer.domElement.addEventListener("contextmenu", e => {
    e.preventDefault();
  });

  renderer.domElement.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse") {
      if (e.button === 0) mine();
      if (e.button === 2) build();
      return;
    }

    lastTouch = {
      x: e.clientX,
      y: e.clientY,
      id: e.pointerId
    };

    renderer.domElement.setPointerCapture(e.pointerId);
  });

  renderer.domElement.addEventListener("pointermove", e => {
    if (!lastTouch || lastTouch.id !== e.pointerId) return;

    const dx = e.clientX - lastTouch.x;
    const dy = e.clientY - lastTouch.y;

    yaw -= dx * 0.006;
    pitch -= dy * 0.006;

    pitch = Math.max(-1.45, Math.min(1.45, pitch));
    syncCamera();

    lastTouch = {
      x: e.clientX,
      y: e.clientY,
      id: e.pointerId
    };
  });

  renderer.domElement.addEventListener("pointerup", e => {
    if (lastTouch && lastTouch.id === e.pointerId) {
      lastTouch = null;
    }
  });

  renderer.domElement.addEventListener("pointercancel", () => {
    lastTouch = null;
  });

  document.getElementById("place").addEventListener("click", build);
  document.getElementById("remove").addEventListener("click", mine);

  document.getElementById("fullscreen").addEventListener(
    "click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (_) {
        status.textContent = "Use your browser's fullscreen control";
      }
    }
  );

  // Press and hold movement buttons.
  document.querySelectorAll("[data-move]").forEach(button => {
    const name = button.dataset.move;

    const down = e => {
      e.preventDefault();
      move[name] = true;
      button.classList.add("active");
    };

    const up = e => {
      e.preventDefault();
      move[name] = false;
      button.classList.remove("active");
    };

    button.addEventListener("pointerdown", down);
    button.addEventListener("pointerup", up);
    button.addEventListener("pointercancel", up);
    button.addEventListener("pointerleave", up);
  });

  function update(dt) {
    const speed = keys["shift"] ? 9 : 5;

    const forward =
      (keys["w"] || keys["arrowup"] || move.forward ? 1 : 0) -
      (keys["s"] || keys["arrowdown"] || move.backward ? 1 : 0);

    const side =
      (keys["d"] || keys["arrowright"] || move.right ? 1 : 0) -
      (keys["a"] || keys["arrowleft"] || move.left ? 1 : 0);

    const direction = new THREE.Vector3(side, 0, -forward);

    if (direction.lengthSq()) {
      direction.normalize().applyAxisAngle(
        new THREE.Vector3(0, 1, 0), yaw
      );

      camera.position.addScaledVector(direction, speed * dt);
    }

    if ((keys[" "] || move.jump) && onGround) {
      jumpVelocity = 6;
      onGround = false;
    }

    jumpVelocity -= 15 * dt;
    camera.position.y += jumpVelocity * dt;

    const groundY = 2.5;

    if (camera.position.y < groundY) {
      camera.position.y = groundY;
      jumpVelocity = 0;
      onGround = true;
    }
  }

  let previous = performance.now();

  function animate(now) {
    requestAnimationFrame(animate);

    const dt = Math.min((now - previous) / 1000, 0.04);
    previous = now;

    update(dt);
    renderer.render(scene, camera);
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  });

  status.textContent =
    "Creative mode · " + blocks.size + " blocks · Pixel textures";

  hint.textContent = "Tap or click to look around";

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
