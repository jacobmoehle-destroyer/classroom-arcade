
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Classroom Sandbox</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #87ceeb;
  font-family: system-ui, Arial, sans-serif;
  touch-action: none;
}

canvas { display: block; }

button {
  border: 2px solid #ffffff55;
  border-radius: 12px;
  background: #17202ddd;
  color: white;
  font-weight: 800;
  font-size: 14px;
  padding: 11px 13px;
  cursor: pointer;
  touch-action: none;
  user-select: none;
}

button:active, button.selected { background: #27864d; }

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  color: white;
  text-shadow: 1px 2px 3px #000;
}

#top {
  position: absolute;
  top: max(10px, env(safe-area-inset-top));
  left: 10px;
  right: 10px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  pointer-events: auto;
}

#brand {
  background: #17202ddd;
  border-radius: 12px;
  padding: 9px 12px;
  font-weight: 900;
}

#top button { padding: 9px 11px; }

#status {
  position: absolute;
  top: 66px;
  left: 12px;
  max-width: 80vw;
  font-size: 12px;
  background: #17202dbb;
  border-radius: 8px;
  padding: 6px 9px;
}

#palette {
  position: absolute;
  left: 50%;
  bottom: max(12px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  max-width: 96vw;
  overflow-x: auto;
  pointer-events: auto;
  padding: 5px;
  background: #101820bb;
  border-radius: 13px;
}

.block-choice {
  min-width: 53px;
  padding: 8px 6px;
  font-size: 11px;
}

.swatch {
  width: 23px;
  height: 23px;
  display: block;
  margin: 0 auto 4px;
  border: 1px solid #ffffff99;
  border-radius: 4px;
}

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 26px;
  font-weight: 900;
  pointer-events: none;
}

#help {
  position: absolute;
  right: 12px;
  top: 72px;
  max-width: 220px;
  background: #17202dcc;
  padding: 9px;
  border-radius: 10px;
  font-size: 11px;
  line-height: 1.5;
}

#movement {
  position: fixed;
  left: 18px;
  bottom: 115px;
  width: 145px;
  height: 130px;
  pointer-events: auto;
}

.move {
  position: absolute;
  width: 44px;
  height: 44px;
  padding: 0;
  font-size: 20px;
  border-radius: 12px;
}

#forward { left: 50px; top: 0; }
#back { left: 50px; bottom: 0; }
#left { left: 0; top: 43px; }
#right { right: 0; top: 43px; }

#actions {
  position: fixed;
  right: 16px;
  bottom: 112px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  pointer-events: auto;
}

#actions button {
  width: 78px;
  height: 55px;
  padding: 5px;
  font-size: 12px;
}

#jump {
  position: fixed;
  right: 22px;
  bottom: 230px;
  width: 78px;
  height: 68px;
  border-radius: 50%;
  background: #267c45ee;
  pointer-events: auto;
}

#lookHint {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  background: #17202dbb;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 11px;
  white-space: nowrap;
  pointer-events: none;
}

@media (pointer: fine) {
  #movement, #jump, #actions { display: none; }
}

@media (max-width: 650px) {
  #brand { font-size: 12px; }
  #top button { font-size: 11px; padding: 8px; }
  #help { top: 105px; right: 8px; max-width: 155px; }
  #status { top: 62px; }
  #palette { gap: 3px; bottom: max(7px, env(safe-area-inset-bottom)); }
  .block-choice { min-width: 46px; font-size: 10px; padding: 6px 4px; }
  #movement { left: 8px; bottom: 105px; transform: scale(.9); transform-origin: bottom left; }
  #actions { right: 8px; bottom: 105px; }
  #actions button { width: 65px; height: 48px; }
  #jump { right: 12px; bottom: 215px; width: 70px; height: 64px; }
  #lookHint { bottom: 69px; font-size: 10px; }
}

@media (orientation: landscape) and (max-height: 500px) {
  #help { display: none; }
  #movement { bottom: 65px; }
  #actions { bottom: 65px; }
  #jump { bottom: 165px; }
  #palette { bottom: 4px; }
  #lookHint { display: none; }
}
</style>
</head>

<body>
<div id="hud">
  <div id="top">
    <div id="brand">🧱 CLASSROOM SANDBOX</div>
    <button id="cameraBtn">🎥 First Person</button>
    <button id="soundBtn">🔊 Sound: On</button>
    <button id="fullscreenBtn">⛶ Fullscreen</button>
    <button id="resetBtn">↻ Respawn</button>
  </div>

  <div id="status">Generating your world...</div>
  <div id="crosshair">+</div>

  <div id="help">
    <b>COMPUTER</b><br>
    WASD / arrows: move<br>
    Space: jump<br>
    Mouse: look around<br>
    Left click: break block<br>
    Right click: place block<br>
    <b>TOUCH</b><br>
    Left pad: move<br>
    Drag screen: look<br>
    Use buttons to build
  </div>

  <div id="palette"></div>
  <div id="lookHint">Drag the world to look around</div>
</div>

<div id="movement">
  <button class="move" id="forward">▲</button>
  <button class="move" id="back">▼</button>
  <button class="move" id="left">◀</button>
  <button class="move" id="right">▶</button>
</div>

<button id="jump">JUMP</button>

<div id="actions">
  <button id="breakBtn">⛏ BREAK</button>
  <button id="placeBtn">🧱 PLACE</button>
</div>

<script src="./three.min.js"></script>
<script>
(() => {
"use strict";

const status = document.getElementById("status");

if (!window.THREE) {
  status.textContent = "Missing three.min.js — check that the Three.js file is in the sandbox folder.";
  return;
}

const THREE = window.THREE;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 24, 65);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 120
);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position = "fixed";
renderer.domElement.style.inset = "0";
renderer.domElement.style.zIndex = "0";

scene.add(new THREE.HemisphereLight(0xffffff, 0x59664b, 2.0));

const sunlight = new THREE.DirectionalLight(0xffffff, 2.2);
sunlight.position.set(-15, 30, 12);
scene.add(sunlight);

const materials = {};
const blockNames = {
  grass: "Grass",
  dirt: "Dirt",
  stone: "Stone",
  sand: "Sand",
  wood: "Wood",
  leaves: "Leaves"
};

const blockColors = {
  grass: 0x62a844,
  dirt: 0x87502c,
  stone: 0x888b91,
  sand: 0xd8c27c,
  wood: 0x93602f,
  leaves: 0x388a3d
};

// Generate original pixel-like textures locally; no external assets needed.
function makeTexture(type) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 32;
  const ctx = canvas.getContext("2d");
  const base = blockColors[type];
  const color = "#" + base.toString(16).padStart(6, "0");
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 32, 32);

  let seed = type.split("").reduce((n, c) => n + c.charCodeAt(0), 17);
  function rand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  for (let i = 0; i < 105; i++) {
    const x = Math.floor(rand() * 32);
    const y = Math.floor(rand() * 32);
    const w = 2 + Math.floor(rand() * 6);
    const h = 2 + Math.floor(rand() * 5);
    const light = rand() > 0.5;
    ctx.fillStyle = light ? "rgba(255,255,255,.15)" : "rgba(0,0,0,.15)";
    ctx.fillRect(x, y, w, h);
  }

  if (type === "grass") {
    ctx.fillStyle = "#87502c";
    ctx.fillRect(0, 25, 32, 7);
    for (let i = 0; i < 9; i++) {
      ctx.fillStyle = i % 2 ? "#4e9637" : "#78bb50";
      ctx.fillRect(Math.floor(rand() * 32), 25, 2, 3);
    }
  } else if (type === "wood") {
    ctx.fillStyle = "#6e4526";
    for (let x = 4; x < 32; x += 8) ctx.fillRect(x, 0, 2, 32);
    ctx.fillStyle = "#b27a3d";
    for (let y = 5; y < 32; y += 11) ctx.fillRect(1, y, 3, 2);
  } else if (type === "leaves") {
    for (let i = 0; i < 30; i++) {
      ctx.fillStyle = i % 2 ? "#246d32" : "#65a947";
      ctx.fillRect(Math.floor(rand() * 32), Math.floor(rand() * 32), 4, 4);
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

for (const type of Object.keys(blockNames)) {
  const texture = makeTexture(type);
  materials[type] = new THREE.MeshLambertMaterial({
    map: texture,
    color: 0xffffff
  });
}

const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
const blocks = new Map();
const blockMeshes = new Map();

const key = (x, y, z) => `${x},${y},${z}`;

function getBlock(x, y, z) {
  return blocks.get(key(x, y, z));
}

function addBlock(x, y, z, type) {
  x = Math.round(x);
  y = Math.round(y);
  z = Math.round(z);

  const k = key(x, y, z);
  if (blocks.has(k)) return false;

  const mesh = new THREE.Mesh(cubeGeometry, materials[type] || materials.grass);
  mesh.position.set(x, y, z);
  mesh.userData = { x, y, z, type };
  scene.add(mesh);
  blocks.set(k, type);
  blockMeshes.set(k, mesh);
  return true;
}

function removeBlock(x, y, z) {
  const k = key(x, y, z);
  const mesh = blockMeshes.get(k);
  if (!mesh) return false;
  scene.remove(mesh);
  blocks.delete(k);
  blockMeshes.delete(k);
  return true;
}

// Build a voxel landscape. Every visible block is also a real collision block.
function terrainHeight(x, z) {
  return Math.floor(
    1.4 +
    Math.sin(x * 0.35) * 1.2 +
    Math.cos(z * 0.28) * 1.1 +
    Math.sin((x + z) * 0.19) * 0.7
  );
}

for (let x = -14; x <= 14; x++) {
  for (let z = -14; z <= 14; z++) {
    const top = terrainHeight(x, z);
    for (let y = -3; y <= top; y++) {
      let type = "stone";
      if (y === top) type = top <= 0 ? "sand" : "grass";
      else if (y >= top - 2) type = "dirt";
      addBlock(x, y, z, type);
    }
  }
}

// A few trees
function makeTree(x, z) {
  const ground = terrainHeight(x, z);
  for (let y = 1; y <= 3; y++) addBlock(x, ground + y, z, "wood");

  for (let dx = -2; dx <= 2; dx++) {
    for (let dz = -2; dz <= 2; dz++) {
      for (let dy = 2; dy <= 4; dy++) {
        if (Math.abs(dx) + Math.abs(dz) + Math.abs(dy - 3) <= 4) {
          addBlock(x + dx, ground + dy, z + dz, "leaves");
        }
      }
    }
  }
}
makeTree(-7, -4);
makeTree(6, -7);
makeTree(8, 6);
makeTree(-8, 8);

// Player feet position. X/Z are horizontal; Y is the player's feet height.
const player = {
  x: 0, y: 8, z: 0,
  vx: 0, vy: 0, vz: 0,
  yaw: 0, pitch: 0,
  grounded: false,
  height: 1.8,
  radius: 0.29
};

const playerGroup = new THREE.Group();
scene.add(playerGroup);

const skin = new THREE.MeshLambertMaterial({ color: 0xe1b28a });
const shirt = new THREE.MeshLambertMaterial({ color: 0x2877cf });
const pants = new THREE.MeshLambertMaterial({ color: 0x333c58 });
const hair = new THREE.MeshLambertMaterial({ color: 0x493020 });
const shoes = new THREE.MeshLambertMaterial({ color: 0x292929 });

function bodyPart(w, h, d, mat, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x, y, z);
  playerGroup.add(mesh);
  return mesh;
}

const torso = bodyPart(0.62, 0.65, 0.34, shirt, 0, 1.12, 0);
bodyPart(0.38, 0.4, 0.36, skin, 0, 1.68, 0);
bodyPart(0.4, 0.12, 0.38, hair, 0, 1.88, 0);

const leftArm = bodyPart(0.2, 0.62, 0.22, shirt, -0.42, 1.13, 0);
const rightArm = bodyPart(0.2, 0.62, 0.22, shirt, 0.42, 1.13, 0);
const leftLeg = bodyPart(0.25, 0.56, 0.26, pants, -0.17, 0.56, 0);
const rightLeg = bodyPart(0.25, 0.56, 0.26, pants, 0.17, 0.56, 0);
bodyPart(0.27, 0.15, 0.35, shoes, -0.17, 0.14, -0.04);
bodyPart(0.27, 0.15, 0.35, shoes, 0.17, 0.14, -0.04);

// Voxel collision. Check every solid block touched by the player's bounding box.
function overlapsBlock(px, feetY, pz) {
  const r = player.radius;
  const minX = Math.floor(px - r + 0.5);
  const maxX = Math.floor(px + r + 0.5);
  const minY = Math.floor(feetY + 0.0001 + 0.5);
  const maxY = Math.floor(feetY + player.height - 0.0001 + 0.5);
  const minZ = Math.floor(pz - r + 0.5);
  const maxZ = Math.floor(pz + r + 0.5);

  for (let x = minX; x <= maxX; x++) {
    for (let y = minY; y <= maxY; y++) {
      for (let z = minZ; z <= maxZ; z++) {
        if (getBlock(x, y, z)) return true;
      }
    }
  }
  return false;
}

function collidesAt(px, feetY, pz) {
  const r = player.radius;
  const minX = Math.floor(px - r + 0.5);
  const maxX = Math.floor(px + r + 0.5);
  const minY = Math.floor(feetY + 0.0001 + 0.5);
  const maxY = Math.floor(feetY + player.height - 0.0001 + 0.5);
  const minZ = Math.floor(pz - r + 0.5);
  const maxZ = Math.floor(pz + r + 0.5);

  for (let x = minX; x <= maxX; x++) {
    for (let y = minY; y <= maxY; y++) {
      for (let z = minZ; z <= maxZ; z++) {
        if (!getBlock(x, y, z)) continue;

        const overlapsX = px + r > x - 0.5 && px - r < x + 0.5;
        const overlapsY = feetY < y + 0.5 && feetY + player.height > y - 0.5;
        const overlapsZ = pz + r > z - 0.5 && pz - r < z + 0.5;

        if (overlapsX && overlapsY && overlapsZ) return true;
      }
    }
  }
  return false;
}

function respawn() {
  player.x = 0;
  player.z = 0;
  player.y = terrainHeight(0, 0) + 0.501;
  player.vx = player.vy = player.vz = 0;
  player.grounded = false;
  player.yaw = 0;
  player.pitch = 0;
}
respawn();

// Movement input
const held = new Set();
const touchMove = { forward: false, back: false, left: false, right: false };

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  held.add(k);

  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) {
    e.preventDefault();
  }
  if (k === " " && !e.repeat) jump();
  if (k === "f") breakTarget();
  if (k === "g") placeTarget();
  if (k === "v") toggleCamera();
});

window.addEventListener("keyup", e => held.delete(e.key.toLowerCase()));
window.addEventListener("blur", () => held.clear());

function bindHold(id, name) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); touchMove[name] = true; };
  const off = e => { e.preventDefault(); touchMove[name] = false; };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off);
  el.addEventListener("lostpointercapture", off);
}
bindHold("forward", "forward");
bindHold("back", "back");
bindHold("left", "left");
bindHold("right", "right");

let soundOn = true;
let audioContext = null;

function playSound(freq, duration, wave = "square", volume = 0.045) {
  if (!soundOn) return;

  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!audioContext) audioContext = new AudioCtx();
    if (audioContext.state === "suspended") audioContext.resume();

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, audioContext.currentTime);
    gain.gain.setValueAtTime(volume, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    osc.stop(audioContext.currentTime + duration);
  } catch (_) {}
}

function jump() {
  if (player.grounded) {
    player.vy = 8.2;
    player.grounded = false;
    playSound(280, 0.12, "triangle");
  }
}

document.getElementById("jump").addEventListener("pointerdown", e => {
  e.preventDefault();
  jump();
});

// Look controls
let isThirdPerson = false;
let dragging = false;
let lastPointerX = 0;
let lastPointerY = 0;

renderer.domElement.addEventListener("contextmenu", e => e.preventDefault());

renderer.domElement.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") {
    if (e.button === 0) breakTarget();
    if (e.button === 2) placeTarget();
    return;
  }
  dragging = true;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
});

renderer.domElement.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse" && document.pointerLockElement === renderer.domElement) {
    player.yaw -= e.movementX * 0.0025;
    player.pitch -= e.movementY * 0.0025;
    player.pitch = THREE.MathUtils.clamp(player.pitch, -1.35, 1.35);
    return;
  }

  if (!dragging || e.pointerType === "mouse") return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  player.yaw -= dx * 0.006;
  player.pitch -= dy * 0.005;
  player.pitch = THREE.MathUtils.clamp(player.pitch, -1.25, 1.25);
});

window.addEventListener("pointerup", () => dragging = false);
window.addEventListener("pointercancel", () => dragging = false);

renderer.domElement.addEventListener("click", () => {
  if (matchMedia("(pointer:fine)").matches &&
      !isThirdPerson && document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock?.();
  }
});

const raycaster = new THREE.Raycaster();
const center = new THREE.Vector2(0, 0);

function targetBlock() {
  raycaster.setFromCamera(center, camera);
  raycaster.far = 6;
  const hits = raycaster.intersectObjects(Array.from(blockMeshes.values()), false);
  return hits.length ? hits[0] : null;
}

function breakTarget() {
  const hit = targetBlock();
  if (!hit) return;
  const p = hit.object.userData;
  // Never destroy the block the player's body currently occupies.
  if (collidesAt(player.x, player.y, player.z) &&
      Math.abs(p.x - player.x) < 1 &&
      Math.abs(p.z - player.z) < 1) {
    status.textContent = "Move away before breaking that block.";
    return;
  }
  removeBlock(p.x, p.y, p.z);
  playSound(115, 0.09, "square");
  status.textContent = "Broke " + blockNames[p.type] + ".";
}

let selectedType = "grass";

function placeTarget() {
  const hit = targetBlock();
  if (!hit || !hit.face) return;

  const p = hit.object.userData;
  const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  const x = Math.round(p.x + normal.x);
  const y = Math.round(p.y + normal.y);
  const z = Math.round(p.z + normal.z);

  // Do not place a block inside the player.
  if (collidesAt(player.x, player.y, player.z)) {
    status.textContent = "You're stuck in a block! Respawn to get free.";
    return;
  }

  const r = player.radius;
  const blockTouchesPlayer =
    x + 0.5 > player.x - r && x - 0.5 < player.x + r &&
    z + 0.5 > player.z - r && z - 0.5 < player.z + r &&
    y + 0.5 > player.y && y - 0.5 < player.y + player.height;

  if (blockTouchesPlayer) {
    status.textContent = "Can't place a block inside yourself!";
    return;
  }

  if (addBlock(x, y, z, selectedType)) {
    playSound(420, 0.07, "triangle");
    status.textContent = "Placed " + blockNames[selectedType] + ".";
  }
}

document.getElementById("breakBtn").addEventListener("pointerdown", e => {
  e.preventDefault(); breakTarget();
});
document.getElementById("placeBtn").addEventListener("pointerdown", e => {
  e.preventDefault(); placeTarget();
});

const palette = document.getElementById("palette");
for (const type of Object.keys(blockNames)) {
  const btn = document.createElement("button");
  btn.className = "block-choice" + (type === selectedType ? " selected" : "");
  const swatch = document.createElement("span");
  swatch.className = "swatch";
  swatch.style.backgroundColor = "#" + blockColors[type].toString(16).padStart(6, "0");
  const label = document.createElement("span");
  label.textContent = blockNames[type];
  btn.append(swatch, label);
  btn.addEventListener("click", () => {
    selectedType = type;
    palette.querySelectorAll("button").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    status.textContent = "Selected " + blockNames[type] + ".";
    playSound(520, 0.04, "sine", 0.025);
  });
  palette.appendChild(btn);
}

function toggleCamera() {
  isThirdPerson = !isThirdPerson;
  document.getElementById("cameraBtn").textContent =
    isThirdPerson ? "🎥 Third Person" : "🎥 First Person";
  status.textContent = isThirdPerson
    ? "Third-person camera enabled. Drag to look around."
    : "First-person camera enabled. Click the world to capture the mouse.";
}
document.getElementById("cameraBtn").addEventListener("click", toggleCamera);

document.getElementById("soundBtn").addEventListener("click", () => {
  soundOn = !soundOn;
  document.getElementById("soundBtn").textContent = soundOn ? "🔊 Sound: On" : "🔇 Sound: Off";
  if (soundOn) playSound(520, 0.08, "sine");
});

document.getElementById("fullscreenBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (_) {
    status.textContent = "Fullscreen isn't available in this browser.";
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  respawn();
  status.textContent = "Respawned!";
});

function updatePlayer(dt) {
  let forward = 0;
  let side = 0;

  if (held.has("w") || held.has("arrowup") || touchMove.forward) forward += 1;
  if (held.has("s") || held.has("arrowdown") || touchMove.back) forward -= 1;
  if (held.has("a") || held.has("arrowleft") || touchMove.left) side -= 1;
  if (held.has("d") || held.has("arrowright") || touchMove.right) side += 1;

  const length = Math.hypot(forward, side);
  if (length > 0) { forward /= length; side /= length; }

  const speed = held.has("shift") ? 7.2 : 5.2;
  const sin = Math.sin(player.yaw);
  const cos = Math.cos(player.yaw);

  player.vx = (side * cos - forward * sin) * speed;
  player.vz = (side * sin + forward * cos) * speed;

  // Move in small substeps to reduce passing through thin walls.
  const steps = Math.max(1, Math.ceil(Math.max(
    Math.abs(player.vx * dt), Math.abs(player.vz * dt)
  ) / 0.12));
  const sx = player.vx * dt / steps;
  const sz = player.vz * dt / steps;

  for (let i = 0; i < steps; i++) {
    if (!collidesAt(player.x + sx, player.y, player.z)) player.x += sx;
    if (!collidesAt(player.x, player.y, player.z + sz)) player.z += sz;
  }

  player.vy -= 22 * dt;
  const verticalSteps = Math.max(1, Math.ceil(Math.abs(player.vy * dt) / 0.12));
  const sy = player.vy * dt / verticalSteps;
  player.grounded = false;

  for (let i = 0; i < verticalSteps; i++) {
    if (!collidesAt(player.x, player.y + sy, player.z)) {
      player.y += sy;
    } else {
      if (sy < 0) player.grounded = true;
      player.vy = 0;
      break;
    }
  }

  if (player.y < -30) respawn();

  playerGroup.position.set(player.x, player.y, player.z);
  playerGroup.rotation.y = player.yaw;

  const moving = length > 0.01;
  const t = performance.now() * 0.009;
  leftLeg.rotation.x = moving ? Math.sin(t) * 0.65 : 0;
  rightLeg.rotation.x = moving ? -Math.sin(t) * 0.65 : 0;
  leftArm.rotation.x = moving ? -Math.sin(t) * 0.55 : 0;
  rightArm.rotation.x = moving ? Math.sin(t) * 0.55 : 0;

  playerGroup.visible = isThirdPerson;
}

function updateCamera() {
  const eye = new THREE.Vector3(player.x, player.y + 1.58, player.z);
  const lookDirection = new THREE.Vector3(
    -Math.sin(player.yaw) * Math.cos(player.pitch),
    Math.sin(player.pitch),
    -Math.cos(player.yaw) * Math.cos(player.pitch)
  );

  if (!isThirdPerson) {
    camera.position.copy(eye);
    camera.lookAt(eye.clone().add(lookDirection));
  } else {
    const distance = 4.5;
    const target = new THREE.Vector3(player.x, player.y + 1.25, player.z);
    const behind = new THREE.Vector3(
      Math.sin(player.yaw) * distance,
      1.5 + Math.sin(-player.pitch) * 1.3,
      Math.cos(player.yaw) * distance
    );

    const desired = target.clone().add(behind);
    // Avoid placing the third-person camera inside a nearby block.
    raycaster.set(target, desired.clone().sub(target).normalize());
    raycaster.far = distance;
    const hits = raycaster.intersectObjects(Array.from(blockMeshes.values()), false);
    if (hits.length && hits[0].distance < distance) {
      desired.copy(target).add(
        desired.clone().sub(target).normalize().multiplyScalar(Math.max(0.5, hits[0].distance - 0.25))
      );
    }

    camera.position.copy(desired);
    camera.lookAt(target);
  }
}

let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.035);
  lastTime = now;
  updatePlayer(dt);
  updateCamera();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

status.textContent = "World ready! Build, dig, jump, and explore.";
})();
</script>
</body>
