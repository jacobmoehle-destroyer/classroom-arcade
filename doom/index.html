
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom Arcade | DOOM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    header {
      padding: 22px 12px 12px;
      background: #1b1b1b;
      border-bottom: 3px solid #a51d1d;
    }

    h1 {
      margin: 0;
      color: #e52b2b;
      font-size: clamp(30px, 7vw, 52px);
      letter-spacing: 3px;
    }

    .subtitle {
      color: #bbb;
      margin: 8px 0 0;
    }

    #launcher {
      max-width: 700px;
      margin: 28px auto;
      padding: 20px;
    }

    .panel {
      background: #202020;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 22px;
      margin: 0 12px 20px;
    }

    h2 {
      margin-top: 0;
    }

    button,
    .file-button {
      display: inline-block;
      margin: 7px;
      padding: 13px 20px;
      border: 0;
      border-radius: 7px;
      background: #b51f24;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover,
    .file-button:hover {
      background: #e13232;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      max-width: 380px;
      margin: 16px auto;
      color: #ddd;
    }

    #status {
      min-height: 24px;
      color: #ffd66b;
      overflow-wrap: anywhere;
    }

    #gameShell {
      display: none;
      width: min(96vw, 960px);
      margin: 18px auto;
      background: black;
      border: 2px solid #555;
      position: relative;
    }

    #canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      background: black;
      image-rendering: pixelated;
      outline: none;
    }

    #gameShell:fullscreen {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
    }

    #gameShell:fullscreen #canvas {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      aspect-ratio: auto;
    }

    .small {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      padding: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>DOOM</h1>
    <p class="subtitle">CLASSROOM ARCADE</p>
  </header>

  <main id="launcher">
    <section class="panel">
      <h2>Choose Your Game</h2>

      <p>
        Select a compatible WAD file from your device.
      </p>

      <input
        id="wadPicker"
        type="file"
        accept=".wad,.WAD,application/octet-stream"
      >

      <p id="selectedFile">No WAD selected.</p>

      <button id="launchButton" disabled>
        LAUNCH GAME
      </button>

      <p id="status" role="status" aria-live="polite">
        Choose a WAD file to begin.
      </p>

      <p class="small">
        Your WAD stays on your device and is not uploaded to GitHub.
        You must provide your own legally obtained game files.
      </p>
    </section>

    <button id="fullscreenButton" disabled>
      ⛶ Fullscreen
    </button>

    <button id="backButton" hidden>
      Choose Another WAD
    </button>
  </main>

  <section id="gameShell">
    <canvas
      id="canvas"
      width="640"
      height="480"
      tabindex="0"
    ></canvas>
  </section>

  <footer>
    Classroom Arcade · Dwasm engine
  </footer>

  <script>
    const picker = document.getElementById("wadPicker");
    const selectedFile = document.getElementById("selectedFile");
    const launchButton = document.getElementById("launchButton");
    const fullscreenButton = document.getElementById("fullscreenButton");
    const backButton = document.getElementById("backButton");
    const status = document.getElementById("status");
    const launcher = document.getElementById("launcher");
    const gameShell = document.getElementById("gameShell");
    const canvas = document.getElementById("canvas");

    let selectedWad = null;
    let engineStarted = false;
    let engineLoading = false;

    picker.addEventListener("change", () => {
      selectedWad = picker.files && picker.files[0]
        ? picker.files[0]
        : null;

      if (engineStarted || engineLoading) {
        selectedWad = null;
        selectedFile.textContent = "Reload the page to choose another WAD.";
        status.textContent = "The engine has already started.";
        launchButton.disabled = true;
        return;
      }

      launchButton.disabled = !selectedWad;

      if (selectedWad) {
        selectedFile.textContent =
          "Selected: " + selectedWad.name;
        status.textContent =
          "Ready to load " + selectedWad.name + ".";
      } else {
        selectedFile.textContent = "No WAD selected.";
        status.textContent = "Choose a WAD file to begin.";
      }
    });

    launchButton.addEventListener("click", async () => {
      if (!selectedWad || engineStarted || engineLoading) {
        return;
      }

      engineLoading = true;
      launchButton.disabled = true;
      picker.disabled = true;
      status.textContent = "Reading WAD file...";

      try {
        const wadBytes = new Uint8Array(
          await selectedWad.arrayBuffer()
        );

        status.textContent = "Starting Dwasm...";

        gameShell.style.display = "block";
        fullscreenButton.disabled = false;
        backButton.hidden = false;

        window.Module = {
          arguments: ["-iwad", "/doom.wad"],

          preRun: [
            function () {
              if (
                typeof window.Module.FS_createDataFile !== "function"
              ) {
                throw new Error(
                  "Dwasm filesystem API is not available."
                );
              }

              window.Module.FS_createDataFile(
                "/",
                "doom.wad",
                wadBytes,
                true,
                true,
                true
              );

              status.textContent =
                "WAD loaded. Starting DOOM...";
            }
          ],

          print: function (text) {
            console.log(text);
          },

          printErr: function (text) {
            console.error(text);
          },

          canvas: canvas,

          onRuntimeInitialized: function () {
            engineStarted = true;
            engineLoading = false;
            status.textContent =
              "Engine ready! Enjoy the game.";
            canvas.focus();
          },

          onAbort: function (reason) {
            engineLoading = false;
            status.textContent =
              "Engine stopped: " + reason;
            console.error(reason);
          }
        };

        const script = document.createElement("script");
        script.src = "index.js";

        script.onload = function () {
          console.log("Dwasm engine script loaded.");
        };

        script.onerror = function () {
          engineLoading = false;
          status.textContent =
            "Could not load index.js. Check that the engine files exist.";
        };

        document.body.appendChild(script);

      } catch (error) {
        engineLoading = false;
        launchButton.disabled = false;
        picker.disabled = false;
        status.textContent =
          "Error: " + error.message;
        console.error(error);
      }
    });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await gameShell.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        status.textContent =
          "Fullscreen could not be opened on this browser.";
      }
    });

    backButton.addEventListener("click", () => {
      if (engineStarted || engineLoading) {
        status.textContent =
          "Reload the page to start another game.";
        return;
      }

      gameShell.style.display = "none";
      fullscreenButton.disabled = true;
    });
  </script>
</body>
</html>
