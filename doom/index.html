
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Classroom Arcade | DOOM</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #111;
  color: #eee;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding: 12px;
  text-align: center;
}

button {
  padding: 8px 12px;
  color: #fff;
  background: #292929;
  border: 1px solid #555;
  border-radius: 6px;
  cursor: pointer;
  font: inherit;
}

button:hover {
  background: #414141;
}

button:disabled {
  opacity: 0.5;
  cursor: wait;
}

header {
  margin: 0 auto 12px;
}

h1 {
  margin: 0 0 5px;
  font-size: 23px;
}

#subtitle {
  color: #aaa;
  font-size: 12px;
}

#launcher {
  width: min(100%, 700px);
  margin: 0 auto 12px;
  padding: 10px;
  background: #1b1b1b;
  border: 1px solid #333;
  border-radius: 8px;
}

#launcher label {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: bold;
}

#wadPicker {
  display: block;
  width: min(100%, 400px);
  margin: 0 auto 8px;
  font-size: 12px;
}

.toolbar {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
}

#startButton {
  background: #792020;
  border-color: #a44;
}

/* The important fix: constrain the ACTUAL game frame. */
#gameWrapper {
  position: relative;
  width: min(640px, 100%);
  aspect-ratio: 4 / 3;
  height: auto;
  margin: 0 auto;
  overflow: hidden;
  background: #000;
  border: 1px solid #444;
}

#game {
  display: block;
  width: 100%;
  height: 100%;
  background: #000;
  object-fit: contain;
  image-rendering: pixelated;
}

/* Keep the controls separate from the game layout. */
#gameToolbar {
  width: min(640px, 100%);
  margin: 9px auto;
}

#status {
  margin-top: 8px;
  color: #bbb;
  font-size: 12px;
  overflow-wrap: anywhere;
}

#console {
  width: min(640px, 100%);
  height: 54px;
  overflow: auto;
  margin: 10px auto;
  padding: 7px;
  color: #bbb;
  background: #080808;
  border: 1px solid #333;
  text-align: left;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: 11px/1.4 monospace;
}

/* Small overlay touch controls. */
#touchControls {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#touchControls.hidden {
  display: none;
}

.controlCluster {
  position: absolute;
  display: grid;
  gap: 4px;
  pointer-events: auto;
}

#movementPad {
  left: 6px;
  bottom: 6px;
  grid-template-columns: repeat(3, 31px);
  grid-template-rows: repeat(2, 31px);
}

#actionPad {
  right: 6px;
  bottom: 6px;
  grid-template-columns: 34px 34px;
  grid-template-rows: repeat(2, 31px);
}

.touchButton {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  background: rgba(35, 35, 35, 0.58);
  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: 6px;
  font-size: 13px;
  font-weight: bold;
  touch-action: none;
}

.touchButton.pressed {
  background: rgba(180, 45, 30, 0.85);
}

#moveUp {
  grid-column: 2;
  grid-row: 1;
}

#moveLeft {
  grid-column: 1;
  grid-row: 2;
}

#moveDown {
  grid-column: 2;
  grid-row: 2;
}

#moveRight {
  grid-column: 3;
  grid-row: 2;
}

#useButton {
  grid-column: 1;
  grid-row: 1;
  font-size: 10px;
}

#fireButton {
  grid-column: 2;
  grid-row: 1 / span 2;
  font-size: 10px;
}

#runButton {
  grid-column: 1;
  grid-row: 2;
  font-size: 10px;
}

#gameWrapper:fullscreen {
  width: 100vw;
  height: 100vh;
  max-width: none;
  aspect-ratio: auto;
  margin: 0;
  border: 0;
}

#gameWrapper:fullscreen #game {
  width: 100%;
  height: 100%;
}

/* iPad and phone: still small, but use available screen width. */
@media (max-width: 700px) {
  body {
    padding: 6px;
  }

  h1 {
    font-size: 19px;
  }

  #launcher {
    margin-bottom: 8px;
    padding: 8px;
  }

  #gameWrapper {
    width: min(480px, 100%);
  }

  #gameToolbar {
    margin: 8px auto;
  }

  #console {
    height: 42px;
  }
}

/* Landscape iPad: don't force a full-screen game. */
@media (orientation: landscape) and (max-height: 600px) {
  body {
    padding: 4px;
  }

  header {
    display: none;
  }

  #launcher {
    width: 100%;
    padding: 4px;
    margin-bottom: 4px;
  }

  #launcher label {
    display: inline-block;
    margin: 0 5px;
  }

  #wadPicker {
    display: inline-block;
    width: 170px;
    margin: 0 4px;
  }

  #launcher button {
    padding: 4px 7px;
    font-size: 12px;
  }

  #status {
    margin-top: 3px;
  }

  #gameWrapper {
    width: min(480px, 100%);
    max-height: 58vh;
  }

  #gameToolbar {
    margin: 4px auto;
  }

  #console {
    display: none;
  }
}
</style>
</head>

<body>

<header>
  <h1>CLASSROOM ARCADE: DOOM</h1>
  <div id="subtitle">Dwasm browser player</div>
</header>

<section id="launcher">
  <label for="wadPicker">Choose a DOOM WAD file</label>
  <input id="wadPicker" type="file" accept=".wad,.WAD">

  <div class="toolbar">
    <button id="startButton" type="button">Load / Restart DOOM</button>
    <button id="backButton" type="button">Back to Arcade</button>
  </div>

  <div id="status">Choose a compatible IWAD file, then load DOOM.</div>
</section>

<div id="gameWrapper">
  <canvas id="game" oncontextmenu="event.preventDefault()"></canvas>

  <div id="touchControls" class="hidden">
    <div id="movementPad" class="controlCluster">
      <button class="touchButton" id="moveUp" data-key="ArrowUp">▲</button>
      <button class="touchButton" id="moveLeft" data-key="ArrowLeft">◀</button>
      <button class="touchButton" id="moveDown" data-key="ArrowDown">▼</button>
      <button class="touchButton" id="moveRight" data-key="ArrowRight">▶</button>
    </div>

    <div id="actionPad" class="controlCluster">
      <button class="touchButton" id="useButton" data-key=" ">USE</button>
      <button class="touchButton" id="fireButton" data-key="Control">FIRE</button>
      <button class="touchButton" id="runButton" data-key="Shift">RUN</button>
    </div>
  </div>
</div>

<div id="gameToolbar" class="toolbar">
  <button id="controlsToggle" type="button">Show Controls</button>
  <button id="fullscreenButton" type="button">Fullscreen</button>
</div>

<pre id="console">Dwasm output will appear here.</pre>

<script>
(() => {
  "use strict";

  const wadPicker = document.getElementById("wadPicker");
  const startButton = document.getElementById("startButton");
  const backButton = document.getElementById("backButton");
  const statusBox = document.getElementById("status");
  const consoleBox = document.getElementById("console");
  const gameWrapper = document.getElementById("gameWrapper");
  const gameCanvas = document.getElementById("game");
  const touchControls = document.getElementById("touchControls");
  const controlsToggle = document.getElementById("controlsToggle");
  const fullscreenButton = document.getElementById("fullscreenButton");

  let selectedWad = null;
  let engineStarted = false;
  let loading = false;
  const activePointers = new Map();

  function setStatus(message) {
    statusBox.textContent = message;
  }

  function log(message) {
    consoleBox.textContent += "\n" + String(message);
    consoleBox.scrollTop = consoleBox.scrollHeight;
  }

  wadPicker.addEventListener("change", () => {
    selectedWad = wadPicker.files && wadPicker.files[0]
      ? wadPicker.files[0]
      : null;

    setStatus(selectedWad
      ? "Selected WAD: " + selectedWad.name
      : "Choose a compatible IWAD file.");
  });

  let controlsVisible =
    window.matchMedia("(pointer: coarse)").matches ||
    navigator.maxTouchPoints > 0;

  function updateControls() {
    touchControls.classList.toggle("hidden", !controlsVisible);
    controlsToggle.textContent = controlsVisible
      ? "Hide Controls"
      : "Show Controls";
    controlsToggle.setAttribute("aria-pressed", String(controlsVisible));

    if (!controlsVisible) releaseAllControls();
  }

  controlsToggle.addEventListener("click", () => {
    controlsVisible = !controlsVisible;
    updateControls();
  });

  updateControls();

  function sendKey(key, type) {
    const keyCodes = {
      ArrowUp: 38,
      ArrowDown: 40,
      ArrowLeft: 37,
      ArrowRight: 39,
      Control: 17,
      Shift: 16,
      " ": 32
    };

    const codeMap = {
      ArrowUp: "ArrowUp",
      ArrowDown: "ArrowDown",
      ArrowLeft: "ArrowLeft",
      ArrowRight: "ArrowRight",
      Control: "ControlLeft",
      Shift: "ShiftLeft",
      " ": "Space"
    };

    const eventOptions = {
      key: key,
      code: codeMap[key] || key,
      keyCode: keyCodes[key] || 0,
      which: keyCodes[key] || 0,
      bubbles: true,
      cancelable: true
    };

    document.dispatchEvent(new KeyboardEvent(type, eventOptions));
    window.dispatchEvent(new KeyboardEvent(type, eventOptions));
  }

  function pressControl(button, pointerId) {
    if (activePointers.has(pointerId)) return;

    const key = button.dataset.key;
    activePointers.set(pointerId, { key, button });
    button.classList.add("pressed");

    if (![...activePointers.values()].some(
      item => item.key === key && item.button !== button
    )) {
      sendKey(key, "keydown");
    }
  }

  function releaseControl(pointerId) {
    const item = activePointers.get(pointerId);
    if (!item) return;

    activePointers.delete(pointerId);
    item.button.classList.remove("pressed");

    const stillHeld = [...activePointers.values()].some(
      active => active.key === item.key
    );

    if (!stillHeld) sendKey(item.key, "keyup");
  }

  function releaseAllControls() {
    const keys = new Set();

    for (const item of activePointers.values()) {
      keys.add(item.key);
      item.button.classList.remove("pressed");
    }

    activePointers.clear();
    keys.forEach(key => sendKey(key, "keyup"));
  }

  document.querySelectorAll(".touchButton").forEach(button => {
    button.addEventListener("contextmenu", event => {
      event.preventDefault();
    });

    button.addEventListener("pointerdown", event => {
      event.preventDefault();

      try {
        button.setPointerCapture(event.pointerId);
      } catch (_) {}

      pressControl(button, event.pointerId);
    });

    button.addEventListener("pointerup", event => {
      event.preventDefault();
      releaseControl(event.pointerId);
    });

    button.addEventListener("pointercancel", event => {
      releaseControl(event.pointerId);
    });

    button.addEventListener("lostpointercapture", event => {
      releaseControl(event.pointerId);
    });
  });

  window.addEventListener("blur", releaseAllControls);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) releaseAllControls();
  });

  fullscreenButton.addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        await gameWrapper.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (_) {
      setStatus("Fullscreen could not be started in this browser.");
    }
  });

  document.addEventListener("fullscreenchange", () => {
    fullscreenButton.textContent = document.fullscreenElement
      ? "Exit Fullscreen"
      : "Fullscreen";
  });

  backButton.addEventListener("click", () => {
    window.location.href = "../index.html";
  });

  startButton.addEventListener("click", async () => {
    if (loading) return;

    if (!selectedWad) {
      setStatus("Choose your WAD file first.");
      wadPicker.click();
      return;
    }

    if (engineStarted) {
      setStatus("The engine is already running. Refresh the page to load another WAD.");
      return;
    }

    loading = true;
    startButton.disabled = true;
    setStatus("Loading " + selectedWad.name + "...");
    consoleBox.textContent = "Starting Dwasm...\n";

    try {
      const wadBytes = new Uint8Array(await selectedWad.arrayBuffer());

      /*
       * Preserve the Dwasm startup approach:
       * selected WAD is written to the virtual filesystem before launch.
       */
      window.Module = {
        canvas: gameCanvas,
        arguments: ["-iwad", "/doom.wad"],

        print: function(message) {
          log(message);
        },

        printErr: function(message) {
          log(message);
        },

        locateFile: function(path) {
          return path;
        },

        preRun: [function() {
          if (typeof FS === "undefined") {
            throw new Error("Dwasm filesystem is not available.");
          }

          FS.writeFile("/doom.wad", wadBytes);
          log("WAD copied into the virtual filesystem.");
        }],

        onRuntimeInitialized: function() {
          engineStarted = true;
          loading = false;
          startButton.disabled = false;
          setStatus("DOOM loaded. Click the game and play!");
          gameWrapper.focus();
        },

        onAbort: function(reason) {
          loading = false;
          startButton.disabled = false;
          setStatus("Dwasm stopped: " + reason);
          log("Engine aborted: " + reason);
        }
      };

      const script = document.createElement("script");
      script.src = "index.js";
      script.async = true;

      script.onload = () => log("Dwasm engine script loaded.");

      script.onerror = () => {
        loading = false;
        startButton.disabled = false;
        setStatus("Could not load index.js. Check the doom folder.");
        log("ERROR: Failed to load index.js.");
      };

      document.body.appendChild(script);
    } catch (error) {
      loading = false;
      startButton.disabled = false;
      setStatus("Could not read the selected WAD: " + error.message);
      log("WAD loading error: " + error.message);
    }
  });
})();
</script>

</body>
</html>
