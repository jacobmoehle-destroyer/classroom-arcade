<body>

<header>
  <h1>CLASSROOM ARCADE: DOOM</h1>
  <div id="subtitle">Dwasm browser player</div>
</header>

<section id="launcher">
  <label for="wadPicker">Choose a DOOM WAD file</label>
  <input id="wadPicker" type="file" accept=".wad,.WAD">

  <div class="toolbar">
    <button id="startButton" type="button">Load / Restart DOOM</button>
    <button id="backButton" type="button">Back to Arcade</button>
  </div>

  <div id="status">Choose a compatible IWAD file, then load DOOM.</div>
</section>

<div id="gameWrapper">
  <canvas id="game" width="640" height="480"
          oncontextmenu="event.preventDefault()"
          tabindex="0"></canvas>

  <div id="touchControls" class="hidden">
    <div id="movementPad" class="controlCluster">
      <button class="touchButton" id="moveUp"
              data-key="ArrowUp" aria-label="Move forward">▲</button>
      <button class="touchButton" id="moveLeft"
              data-key="ArrowLeft" aria-label="Turn left">◀</button>
      <button class="touchButton" id="moveDown"
              data-key="ArrowDown" aria-label="Move backward">▼</button>
      <button class="touchButton" id="moveRight"
              data-key="ArrowRight" aria-label="Turn right">▶</button>
    </div>

    <div id="actionPad" class="controlCluster">
      <button class="touchButton" id="useButton"
              data-key=" " aria-label="Use or open door">USE</button>

      <button class="touchButton attack" id="fireButton"
              data-key="Control" aria-label="Fire weapon">FIRE</button>

      <button class="touchButton" id="runButton"
              data-key="Shift" aria-label="Run">RUN</button>

      <button class="touchButton special" id="menuButton"
              data-key="Escape" aria-label="Open menu">MENU</button>

      <button class="touchButton confirm" id="enterButton"
              data-key="Enter" aria-label="Confirm or select">ENTER</button>

      <button class="touchButton special" id="mapButton"
              data-key="Tab" aria-label="Toggle automap">MAP</button>
    </div>
  </div>
</div>

<div id="gameToolbar" class="toolbar">
  <button id="controlsToggle" type="button">Show Controls</button>
  <button id="fullscreenButton" type="button">Fullscreen</button>
</div>

<pre id="console">Dwasm output will appear here.</pre>

<script>
(() => {
  "use strict";

  const wadPicker = document.getElementById("wadPicker");
  const startButton = document.getElementById("startButton");
  const backButton = document.getElementById("backButton");
  const statusBox = document.getElementById("status");
  const consoleBox = document.getElementById("console");
  const gameWrapper = document.getElementById("gameWrapper");
  const gameCanvas = document.getElementById("game");
  const touchControls = document.getElementById("touchControls");
  const controlsToggle = document.getElementById("controlsToggle");
  const fullscreenButton = document.getElementById("fullscreenButton");

  let selectedWad = null;
  let engineStarted = false;
  let loading = false;

  const activePointers = new Map();

  function setStatus(message) {
    statusBox.textContent = message;
  }

  function log(message) {
    consoleBox.textContent += "\n" + String(message);
    consoleBox.scrollTop = consoleBox.scrollHeight;
  }

  wadPicker.addEventListener("change", () => {
    selectedWad = wadPicker.files && wadPicker.files[0]
      ? wadPicker.files[0]
      : null;

    setStatus(selectedWad
      ? "Selected WAD: " + selectedWad.name
      : "Choose a compatible IWAD file.");
  });

  let controlsVisible =
    window.matchMedia("(pointer: coarse)").matches ||
    navigator.maxTouchPoints > 0;

  function updateControls() {
    touchControls.classList.toggle("hidden", !controlsVisible);
    controlsToggle.textContent = controlsVisible
      ? "Hide Controls"
      : "Show Controls";

    controlsToggle.setAttribute(
      "aria-pressed",
      String(controlsVisible)
    );

    if (!controlsVisible) releaseAllControls();
  }

  controlsToggle.addEventListener("click", () => {
    controlsVisible = !controlsVisible;
    updateControls();
  });

  const keyInfo = {
    ArrowUp:    { keyCode: 38, code: "ArrowUp" },
    ArrowDown:  { keyCode: 40, code: "ArrowDown" },
    ArrowLeft:  { keyCode: 37, code: "ArrowLeft" },
    ArrowRight: { keyCode: 39, code: "ArrowRight" },
    Control:    { keyCode: 17, code: "ControlLeft" },
    Shift:      { keyCode: 16, code: "ShiftLeft" },
    " ":        { keyCode: 32, code: "Space" },
    Escape:     { keyCode: 27, code: "Escape" },
    Enter:      { keyCode: 13, code: "Enter" },
    Tab:        { keyCode: 9, code: "Tab" }
  };

  /*
   * Send keyboard-style events to all common browser targets.
   * Note: browsers do not treat synthetic events as trusted physical
   * keyboard input, so some SDL builds may still ignore these events.
   */
  function sendKey(key, type) {
    const info = keyInfo[key];
    if (!info) return;

    const options = {
      key: key === " " ? " " : key,
      code: info.code,
      bubbles: true,
      cancelable: true,
      composed: true,
      repeat: false
    };

    const targets = [gameCanvas, document, window];

    for (const target of targets) {
      const event = new KeyboardEvent(type, options);

      try {
        Object.defineProperty(event, "keyCode", {
          get: () => info.keyCode
        });

        Object.defineProperty(event, "which", {
          get: () => info.keyCode
        });

        Object.defineProperty(event, "charCode", {
          get: () => type === "keypress" ? info.keyCode : 0
        });
      } catch (_) {}

      target.dispatchEvent(event);
    }
  }

  function tapKey(key) {
    sendKey(key, "keydown");
    sendKey(key, "keyup");
  }

  /*
   * MENU tries Enter first to leave an attract/demo screen,
   * then Escape to request the DOOM menu.
   */
  function activateMenu() {
    tapKey("Enter");

    window.setTimeout(() => {
      tapKey("Escape");
    }, 120);
  }

  function pressControl(button, pointerId) {
    if (activePointers.has(pointerId)) return;

    const key = button.dataset.key;

    const alreadyHeld = [...activePointers.values()]
      .some(item => item.key === key);

    activePointers.set(pointerId, { key, button });
    button.classList.add("pressed");

    if (button.id === "menuButton") {
      activateMenu();
      return;
    }

    if (!alreadyHeld) sendKey(key, "keydown");
  }

  function releaseControl(pointerId) {
    const item = activePointers.get(pointerId);
    if (!item) return;

    activePointers.delete(pointerId);
    item.button.classList.remove("pressed");

    if (item.button.id === "menuButton") return;

    const stillHeld = [...activePointers.values()]
      .some(active => active.key === item.key);

    if (!stillHeld) sendKey(item.key, "keyup");
  }

  function releaseAllControls() {
    const keys = new Set();

    for (const item of activePointers.values()) {
      if (item.button.id !== "menuButton") {
        keys.add(item.key);
      }

      item.button.classList.remove("pressed");
    }

    activePointers.clear();
    keys.forEach(key => sendKey(key, "keyup"));
  }

  document.querySelectorAll(".touchButton").forEach(button => {
    button.addEventListener("contextmenu", event => {
      event.preventDefault();
    });

    button.addEventListener("pointerdown", event => {
      event.preventDefault();

      try {
        button.setPointerCapture(event.pointerId);
      } catch (_) {}

      pressControl(button, event.pointerId);
    });

    button.addEventListener("pointerup", event => {
      event.preventDefault();
      releaseControl(event.pointerId);
    });

    button.addEventListener("pointercancel", event => {
      releaseControl(event.pointerId);
    });

    button.addEventListener("lostpointercapture", event => {
      releaseControl(event.pointerId);
    });
  });

  window.addEventListener("blur", releaseAllControls);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) releaseAllControls();
  });

  fullscreenButton.addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        if (gameWrapper.requestFullscreen) {
          await gameWrapper.requestFullscreen();
        } else if (gameWrapper.webkitRequestFullscreen) {
          gameWrapper.webkitRequestFullscreen();
        } else {
          setStatus("Fullscreen is not supported by this browser.");
        }
      } else if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch (error) {
      setStatus("Fullscreen error: " + error.message);
    }
  });

  document.addEventListener("fullscreenchange", () => {
    fullscreenButton.textContent = document.fullscreenElement
      ? "Exit Fullscreen"
      : "Fullscreen";

    setTimeout(correctViewport, 100);
  });

  backButton.addEventListener("click", () => {
    window.location.href = "../index.html";
  });

  function correctViewport() {
    const glObject = gameCanvas.GLctxObject;
    if (!glObject || !glObject.GLctx) return;

    const gl = glObject.GLctx;
    const width = gl.drawingBufferWidth;
    const height = gl.drawingBufferHeight;

    if (!width || !height) return;

    const viewport = gl.getParameter(gl.VIEWPORT);

    if (
      viewport[0] !== 0 ||
      viewport[1] !== 0 ||
      viewport[2] > width ||
      viewport[3] > height
    ) {
      gl.viewport(0, 0, width, height);
    }
  }

  function loadEngine(wadBytes) {
    window.Module = {
      canvas: gameCanvas,
      arguments: ["-iwad", "/doom.wad"],

      print: function(message) {
        log(message);
      },

      printErr: function(message) {
        log("ERROR: " + message);
      },

      locateFile: function(path) {
        return path;
      },

      preRun: [function() {
        const module = window.Module;

        const fs = module && module.FS
          ? module.FS
          : (typeof FS !== "undefined" ? FS : null);

        if (!fs || typeof fs.writeFile !== "function") {
          throw new Error(
            "Dwasm filesystem is not ready; could not install the selected WAD."
          );
        }

        fs.writeFile("/doom.wad", wadBytes);
        log("WAD copied into the virtual filesystem.");
      }],

      onRuntimeInitialized: function() {
        engineStarted = true;
        loading = false;
        startButton.disabled = false;

        setStatus("DOOM engine initialized.");
        setTimeout(correctViewport, 100);
      },

      onAbort: function(reason) {
        loading = false;
        startButton.disabled = false;

        setStatus("Dwasm stopped: " + reason);
        log("Engine aborted: " + reason);
      }
    };

    const script = document.createElement("script");
    script.src = "index.js";
    script.async = true;

    script.onload = () => log("Dwasm engine script loaded.");

    script.onerror = () => {
      loading = false;
      startButton.disabled = false;

      setStatus(
        "Could not load index.js. Check that the engine files exist in the doom folder."
      );

      log("ERROR: Failed to load index.js.");
    };

    document.body.appendChild(script);
  }

  startButton.addEventListener("click", async () => {
    if (loading) return;

    if (engineStarted) {
      setStatus("The engine is already running. Refresh to restart DOOM.");
      return;
    }

    if (!selectedWad) {
      setStatus("Choose your WAD file first.");
      wadPicker.click();
      return;
    }

    loading = true;
    startButton.disabled = true;

    setStatus("Loading " + selectedWad.name + "...");
    consoleBox.textContent = "Starting Dwasm...\n";

    try {
      const wadBytes = new Uint8Array(
        await selectedWad.arrayBuffer()
      );

      loadEngine(wadBytes);
    } catch (error) {
      loading = false;
      startButton.disabled = false;

      setStatus("Could not read the selected WAD: " + error.message);
      log("WAD loading error: " + error.message);
    }
  });

  updateControls();

  setInterval(correctViewport, 250);

  window.addEventListener("resize", () => {
    setTimeout(correctViewport, 100);
  });

})();
</script>

</body>
</html>
```
