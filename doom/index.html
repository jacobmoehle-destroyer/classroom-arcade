<body>
<div id="app">

  <h1>DOOM</h1>

  <section id="launcher">
    <p>
      Choose a compatible DOOM WAD file, then launch the game.
      Your WAD stays on your device.
    </p>

    <input id="wadPicker" type="file" accept=".wad,.WAD,application/octet-stream">

    <div id="toolbar">
      <button id="playButton" disabled>PLAY DOOM</button>
      <button id="fullscreenButton">FULLSCREEN</button>
      <button id="backButton">BACK TO ARCADE</button>
    </div>

    <div id="status">Choose a WAD file to begin.</div>
  </section>

  <div id="gameFrame">
    <canvas id="gameCanvas" tabindex="0" aria-label="DOOM game screen"></canvas>

    <section id="touchControls" aria-label="Touchscreen game controls">

      <div id="leftTop">
        <button class="touchButton" id="menuButton" type="button" aria-label="Open controls menu">☰</button>
        <button class="touchButton" id="escapeButton" type="button" aria-label="Escape">↩</button>

        <button class="touchButton" id="arrowUp" data-key="ArrowUp" type="button" aria-label="Arrow up">↑</button>
        <button class="touchButton" id="arrowLeft" data-key="ArrowLeft" type="button" aria-label="Arrow left">←</button>
        <button class="touchButton" id="arrowDown" data-key="ArrowDown" type="button" aria-label="Arrow down">↓</button>
        <button class="touchButton" id="arrowRight" data-key="ArrowRight" type="button" aria-label="Arrow right">→</button>
      </div>

      <div id="wasdPad">
        <button class="touchButton" id="keyW" data-key="w" type="button" aria-label="W forward">W</button>
        <button class="touchButton" id="keyA" data-key="a" type="button" aria-label="A left">A</button>
        <button class="touchButton" id="keyD" data-key="d" type="button" aria-label="D right">D</button>
        <button class="touchButton" id="keyS" data-key="s" type="button" aria-label="S backward">S</button>
      </div>

      <div id="rightTop">
        <button class="touchButton" id="nextWeapon" data-key="]" type="button" aria-label="Next weapon">⇥</button>
        <button class="touchButton" id="minusButton" data-key="-" type="button" aria-label="Minus">−</button>
        <button class="touchButton" id="plusButton" data-key="=" type="button" aria-label="Plus">+</button>

        <button class="touchButton" id="gearUp" data-key="ArrowUp" type="button" aria-label="Up">⚙↑</button>
        <button class="touchButton" id="yesButton" data-key="y" type="button" aria-label="Yes">Y</button>
        <button class="touchButton" id="gearDown" data-key="ArrowDown" type="button" aria-label="Down">⚙↓</button>
        <button class="touchButton" id="noButton" data-key="n" type="button" aria-label="No">N</button>
      </div>

      <div id="rightBottom">
        <button class="touchButton" id="useButton" data-key="Space" type="button" aria-label="Use">↵</button>
        <button class="touchButton" id="fireButton" data-key="Control" type="button" aria-label="Fire weapon">⊕</button>
      </div>

      <div id="overlayMenu">
        <strong>CLASSROOM ARCADE DOOM</strong>
        <button id="resumeButton" type="button">RESUME</button>
        <button id="menuFullscreen" type="button">TOGGLE FULLSCREEN</button>
        <button id="menuBack" type="button">BACK TO ARCADE</button>
      </div>

    </section>
  </div>

  <pre id="console"></pre>

  <p class="smallNote">
    Touch and hold the transparent controls to play. On a computer,
    use your keyboard as usual.
  </p>
</div>

<script>
"use strict";

const wadPicker = document.getElementById("wadPicker");
const playButton = document.getElementById("playButton");
const fullscreenButton = document.getElementById("fullscreenButton");
const backButton = document.getElementById("backButton");
const statusBox = document.getElementById("status");
const gameFrame = document.getElementById("gameFrame");
const gameCanvas = document.getElementById("gameCanvas");
const consoleBox = document.getElementById("console");
const overlayMenu = document.getElementById("overlayMenu");

let wadBytes = null;
let selectedWadName = "";
let engineStarted = false;
let engineLoading = false;

/* Track active touches separately so shared keys don't release too early. */
const activePointers = new Map();
const keyCounts = new Map();

function setStatus(message) {
  statusBox.textContent = message;
}

function showConsole(message) {
  consoleBox.style.display = "block";
  consoleBox.textContent += String(message) + "\n";
  consoleBox.scrollTop = consoleBox.scrollHeight;
}

function getKeyInfo(key) {
  const map = {
    ArrowUp:    { key: "ArrowUp", code: "ArrowUp", keyCode: 38 },
    ArrowDown:  { key: "ArrowDown", code: "ArrowDown", keyCode: 40 },
    ArrowLeft:  { key: "ArrowLeft", code: "ArrowLeft", keyCode: 37 },
    ArrowRight: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
    Control:    { key: "Control", code: "ControlLeft", keyCode: 17 },
    Space:      { key: " ", code: "Space", keyCode: 32 },
    Shift:      { key: "Shift", code: "ShiftLeft", keyCode: 16 },
    Enter:      { key: "Enter", code: "Enter", keyCode: 13 },
    Escape:     { key: "Escape", code: "Escape", keyCode: 27 },
    w:          { key: "w", code: "KeyW", keyCode: 87 },
    a:          { key: "a", code: "KeyA", keyCode: 65 },
    s:          { key: "s", code: "KeyS", keyCode: 83 },
    d:          { key: "d", code: "KeyD", keyCode: 68 },
    y:          { key: "y", code: "KeyY", keyCode: 89 },
    n:          { key: "n", code: "KeyN", keyCode: 78 },
    "]":        { key: "]", code: "BracketRight", keyCode: 221 },
    "-":        { key: "-", code: "Minus", keyCode: 189 },
    "=":        { key: "=", code: "Equal", keyCode: 187 }
  };

  return map[key] || null;
}

/*
 * Dispatch synthetic key events to document.
 * This may work if Dwasm's Emscripten keyboard callback is attached
 * to document. Some engines ignore synthetic events; if so, a native
 * engine input bridge will be needed.
 */
function dispatchKey(key, down) {
  const info = getKeyInfo(key);
  if (!info) return;

  const event = new KeyboardEvent(down ? "keydown" : "keyup", {
    key: info.key,
    code: info.code,
    keyCode: info.keyCode,
    which: info.keyCode,
    bubbles: true,
    cancelable: true
  });

  document.dispatchEvent(event);
}

function pressKey(key, pointerId) {
  if (activePointers.has(pointerId)) return;

  activePointers.set(pointerId, key);

  const count = keyCounts.get(key) || 0;
  keyCounts.set(key, count + 1);

  if (count === 0) {
    dispatchKey(key, true);
  }
}

function releasePointer(pointerId) {
  if (!activePointers.has(pointerId)) return;

  const key = activePointers.get(pointerId);
  activePointers.delete(pointerId);

  const count = Math.max(0, (keyCounts.get(key) || 1) - 1);

  if (count === 0) {
    keyCounts.delete(key);
    dispatchKey(key, false);
  } else {
    keyCounts.set(key, count);
  }
}

function releaseAllKeys() {
  for (const pointerId of Array.from(activePointers.keys())) {
    releasePointer(pointerId);
  }
}

document.querySelectorAll("[data-key]").forEach(button => {
  button.addEventListener("contextmenu", event => event.preventDefault());

  button.addEventListener("pointerdown", event => {
    event.preventDefault();

    try {
      button.setPointerCapture(event.pointerId);
    } catch (_) {}

    button.classList.add("pressed");
    pressKey(button.dataset.key, event.pointerId);
  });

  function release(event) {
    if (event) event.preventDefault();
    releasePointer(event ? event.pointerId : -1);

    if (!Array.from(activePointers.values()).includes(button.dataset.key)) {
      button.classList.remove("pressed");
    }
  }

  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
});

window.addEventListener("blur", releaseAllKeys);
window.addEventListener("pagehide", releaseAllKeys);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) releaseAllKeys();
});

document.addEventListener("keydown", event => {
  if (event.target === wadPicker) return;

  if ([
    "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"
  ].includes(event.code)) {
    event.preventDefault();
  }
}, { passive: false });

/* Local WAD selection */
wadPicker.addEventListener("change", async () => {
  const file = wadPicker.files && wadPicker.files[0];

  if (!file) {
    wadBytes = null;
    selectedWadName = "";
    playButton.disabled = true;
    setStatus("Choose a WAD file to begin.");
    return;
  }

  try {
    setStatus("Reading " + file.name + "...");

    const bytes = new Uint8Array(await file.arrayBuffer());

    if (bytes.length < 4) {
      throw new Error("This file is too small to be a valid WAD.");
    }

    const signature = String.fromCharCode(
      bytes[0], bytes[1], bytes[2], bytes[3]
    );

    if (signature !== "IWAD" && signature !== "PWAD") {
      throw new Error("This file does not have an IWAD or PWAD signature.");
    }

    wadBytes = bytes;
    selectedWadName = file.name;
    playButton.disabled = engineStarted || engineLoading;

    setStatus(
      "Selected: " + selectedWadName +
      " (" + Math.round(wadBytes.length / 1024) + " KB)"
    );
  } catch (error) {
    wadBytes = null;
    selectedWadName = "";
    playButton.disabled = true;
    setStatus(error.message || "Could not read the WAD file.");
  }
});

/*
 * Keep the same basic Emscripten launcher arrangement.
 * Do not replace index.js, index.data, or index.wasm.
 */
playButton.addEventListener("click", () => {
  if (!wadBytes || engineStarted || engineLoading) return;

  engineLoading = true;
  playButton.disabled = true;

  setStatus("Starting Dwasm...");
  showConsole("Selected WAD: " + selectedWadName);
  showConsole("Loading Dwasm engine...");

  window.Module = {
    arguments: ["-iwad", "/doom.wad"],

    preRun: [
      function () {
        if (!window.Module.FS_createDataFile) {
          throw new Error("Dwasm filesystem API is unavailable.");
        }

        window.Module.FS_createDataFile(
          "/",
          "doom.wad",
          wadBytes,
          true,
          true,
          true
        );

        showConsole("WAD copied into the virtual filesystem.");
      }
    ],

    canvas: gameCanvas,

    print: function (message) {
      showConsole(message);
    },

    printErr: function (message) {
      showConsole(message);
    },

    setStatus: function (message) {
      if (message) setStatus(message);
    },

    onRuntimeInitialized: function () {
      engineStarted = true;
      engineLoading = false;

      gameFrame.classList.add("playing");
      setStatus("Dwasm engine loaded. Enjoy DOOM!");
      showConsole("Dwasm engine loaded.");

      gameCanvas.focus();
    },

    onAbort: function (reason) {
      engineLoading = false;
      playButton.disabled = false;
      setStatus("Dwasm stopped: " + reason);
      showConsole("Engine abort: " + reason);
    }
  };

  const script = document.createElement("script");
  script.src = "index.js";

  script.onload = function () {
    showConsole("Dwasm engine script loaded.");
  };

  script.onerror = function () {
    engineLoading = false;
    playButton.disabled = false;
    setStatus("Could not load index.js. Check your engine files.");
    showConsole("ERROR: Failed to load index.js.");
  };

  document.body.appendChild(script);
});

/* Fullscreen */
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else if (gameFrame.requestFullscreen) {
      await gameFrame.requestFullscreen();
    } else if (gameCanvas.webkitRequestFullscreen) {
      gameCanvas.webkitRequestFullscreen();
    } else {
      setStatus("Fullscreen is not supported by this browser.");
    }
  } catch (_) {
    setStatus("Fullscreen could not be opened by this browser.");
  }
}

fullscreenButton.addEventListener("click", toggleFullscreen);
document.getElementById("menuFullscreen").addEventListener("click", () => {
  overlayMenu.classList.remove("visible");
  toggleFullscreen();
});

function goBack() {
  releaseAllKeys();
  window.location.href = "../index.html";
}

backButton.addEventListener("click", goBack);
document.getElementById("menuBack").addEventListener("click", goBack);

/* Overlay menu */
document.getElementById("menuButton").addEventListener("click", () => {
  overlayMenu.classList.toggle("visible");
});

document.getElementById("resumeButton").addEventListener("click", () => {
  overlayMenu.classList.remove("visible");
});

/* Prevent a long press from opening browser selection/context menus. */
document.addEventListener("contextmenu", event => {
  if (gameFrame.contains(event.target)) event.preventDefault();
});
</script>
</body>
</html>
