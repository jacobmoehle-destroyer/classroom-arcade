  <style>

<body>
  <h1>DOOM</h1>
  <p>Classroom Arcade | Dwasm Web Player</p>

  <div class="toolbar">
    <label class="file-label" for="wadFile">
      Choose DOOM WAD
    </label>

    <input
      id="wadFile"
      type="file"
      accept=".wad,.WAD"
    >

    <button id="fullscreenButton" type="button">
      ⛶ Fullscreen
    </button>
  </div>

  <p id="status">
    Choose your DOOM.WAD or DOOM2.WAD file to start.
  </p>

  <div id="gameWrapper">
    <canvas id="canvas" width="640" height="480"></canvas>
  </div>

  <pre id="console"></pre>

  <script>
    const wadInput = document.getElementById("wadFile");
    const statusText = document.getElementById("status");
    const fullscreenButton =
      document.getElementById("fullscreenButton");
    const gameWrapper = document.getElementById("gameWrapper");
    const canvas = document.getElementById("canvas");
    const consoleOutput = document.getElementById("console");

    let engineStarted = false;

    function logMessage(message) {
      consoleOutput.textContent += String(message) + "\n";
    }

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await gameWrapper.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        statusText.textContent =
          "Fullscreen error: " + error.message;
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent =
        document.fullscreenElement
          ? "⛶ Exit Fullscreen"
          : "⛶ Fullscreen";

      window.dispatchEvent(new Event("resize"));
    });

    function startEngine(wadBytes, wadName) {
      if (engineStarted) {
        statusText.textContent =
          "Reload the page to choose another WAD.";
        return;
      }

      engineStarted = true;
      wadInput.disabled = true;
      statusText.textContent = "Loading " + wadName + "...";
      logMessage("Selected WAD: " + wadName);

      /*
       * IMPORTANT:
       * This Dwasm build exposes FS_createDataFile,
       * not Module.FS. Inject the local WAD through
       * the actual API exported by index.js.
       */
      const localWad = new Uint8Array(wadBytes);

      window.Module = {
        canvas: canvas,

        arguments: ["-iwad", "/doom.wad"],

        print: function (message) {
          logMessage(message);
        },

        printErr: function (message) {
          logMessage("ERROR: " + message);
        },

        setStatus: function (message) {
          if (message) {
            statusText.textContent = message;
          }
        },

        locateFile: function (path) {
          return "./" + path;
        },

        preRun: [
          function (module) {
            try {
              if (typeof module.FS_createDataFile !== "function") {
                throw new Error(
                  "Dwasm did not expose FS_createDataFile."
                );
              }

              /*
               * Create /doom.wad in the virtual filesystem.
               * The engine's preRun hook runs after the
               * filesystem has been initialized.
               */
              module.FS_createDataFile(
                "/",
                "doom.wad",
                localWad,
                true,
                true,
                true
              );

              logMessage(
                "WAD injected into Dwasm filesystem successfully."
              );
            } catch (error) {
              logMessage("WAD loading error: " + error.message);
              statusText.textContent =
                "Could not load WAD: " + error.message;
              throw error;
            }
          }
        ],

        onRuntimeInitialized: function () {
          statusText.textContent =
            "DOOM engine initialized. Click the game to play.";
          logMessage("Dwasm runtime initialized.");
        },

        onAbort: function (reason) {
          statusText.textContent = "Engine stopped: " + reason;
          logMessage("Engine stopped: " + reason);
        }
      };

      const script = document.createElement("script");
      script.src = "./index.js";

      script.onload = function () {
        logMessage("Dwasm engine script loaded.");
      };

      script.onerror = function () {
        statusText.textContent =
          "Could not load index.js. Check your doom folder.";
        logMessage("Failed to load ./index.js");
        engineStarted = false;
        wadInput.disabled = false;
      };

      document.body.appendChild(script);
    }

    wadInput.addEventListener("change", async function () {
      const file = wadInput.files && wadInput.files[0];

      if (!file) {
        return;
      }

      if (!file.name.toLowerCase().endsWith(".wad")) {
        statusText.textContent = "Choose a .wad file.";
        wadInput.value = "";
        return;
      }

      try {
        const bytes = await file.arrayBuffer();
        startEngine(bytes, file.name);
      } catch (error) {
        statusText.textContent =
          "Could not read WAD: " + error.message;
        wadInput.disabled = false;
      }
    });
  </script>
</body>
</html>
