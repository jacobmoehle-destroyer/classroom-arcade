<body>
<main>
  <h1>DOOM</h1>
  <p>Classroom Arcade | Dwasm Web Player</p>

  <section class="panel" id="launcher">
    <h2>Choose your DOOM WAD</h2>

    <p class="hint">
      Select a compatible WAD file from your device.
      The browser reads the file locally; this launcher does not upload it.
    </p>

    <input id="wadFile" type="file" accept=".wad,.WAD">
    <br>

    <button id="startButton" disabled>Start DOOM</button>
    <p id="status" role="status">Choose a WAD file to begin.</p>
  </section>

  <div id="gameWrapper">
    <button id="fullscreenButton" type="button">
      ⛶ Fullscreen
    </button>

    <canvas id="game" oncontextmenu="event.preventDefault()"></canvas>
  </div>

  <h3>Game Log</h3>
  <pre id="output"></pre>
</main>

<script>
(function () {
  "use strict";

  const wadInput = document.getElementById("wadFile");
  const startButton = document.getElementById("startButton");
  const statusElement = document.getElementById("status");
  const outputElement = document.getElementById("output");
  const canvas = document.getElementById("game");
  const gameWrapper = document.getElementById("gameWrapper");
  const launcher = document.getElementById("launcher");
  const fullscreenButton = document.getElementById("fullscreenButton");

  let selectedWad = null;
  let engineStarted = false;

  function log(message) {
    outputElement.textContent += String(message) + "\n";
    outputElement.scrollTop = outputElement.scrollHeight;
  }

  function setStatus(message) {
    statusElement.textContent = message;
  }

  wadInput.addEventListener("change", function () {
    selectedWad = wadInput.files && wadInput.files[0];
    startButton.disabled = !selectedWad || engineStarted;

    if (selectedWad) {
      setStatus("Selected: " + selectedWad.name);
    } else {
      setStatus("Choose a WAD file to begin.");
    }
  });

  fullscreenButton.addEventListener("click", async function () {
    try {
      if (!document.fullscreenElement) {
        await gameWrapper.requestFullscreen();
        fullscreenButton.textContent = "✕ Exit Fullscreen";
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      log("Fullscreen error: " + error.message);
      setStatus("Fullscreen could not be enabled.");
    }
  });

  document.addEventListener("fullscreenchange", function () {
    fullscreenButton.textContent = document.fullscreenElement
      ? "✕ Exit Fullscreen"
      : "⛶ Fullscreen";

    // Notify the renderer that the display size may have changed.
    window.dispatchEvent(new Event("resize"));
  });

  startButton.addEventListener("click", async function () {
    if (!selectedWad || engineStarted) return;

    startButton.disabled = true;
    wadInput.disabled = true;

    try {
      setStatus("Reading WAD file...");

      const wadBytes = new Uint8Array(
        await selectedWad.arrayBuffer()
      );

      if (wadBytes.length < 12) {
        throw new Error("The selected file is too small to be a WAD.");
      }

      const signature = String.fromCharCode(
        wadBytes[0], wadBytes[1], wadBytes[2], wadBytes[3]
      );

      if (signature !== "IWAD" && signature !== "PWAD") {
        throw new Error("This file does not appear to be a valid WAD.");
      }

      window.localDoomWadBytes = wadBytes;

      const engineBase = new URL("./", window.location.href);

      // Show and size the game area before starting the renderer.
      gameWrapper.style.display = "block";

      window.Module = {
        arguments: ["-iwad", "/doom.wad"],
        canvas: canvas,

        print: log,
        printErr: log,

        setStatus: function (message) {
          if (message) setStatus(message);
        },

        locateFile: function (path) {
          return new URL(path, engineBase).href;
        },

        preRun: [
          function () {
            const fs = typeof FS !== "undefined" ? FS : window.FS;

            if (!fs || typeof fs.writeFile !== "function") {
              throw new Error(
                "Dwasm filesystem FS is not accessible from the launcher."
              );
            }

            fs.writeFile("/doom.wad", window.localDoomWadBytes);
            log("WAD installed at /doom.wad");
          }
        ],

        onAbort: function (reason) {
          log("Engine aborted: " + reason);
          setStatus("The engine stopped. Check the game log.");
        },

        onRuntimeInitialized: function () {
          setStatus("DOOM engine initialized.");
          log("Engine initialized.");
        }
      };

      engineStarted = true;
      setStatus("Loading DOOM...");

      const script = document.createElement("script");
      script.src = new URL("index.js", engineBase).href;

      script.onload = function () {
        launcher.style.display = "none";
        setStatus("DOOM loaded. Enjoy!");
        log("Dwasm JavaScript loaded.");
      };

      script.onerror = function () {
        log("ERROR: Could not load index.js.");
        setStatus("Could not load the game engine.");
        engineStarted = false;
        startButton.disabled = false;
        wadInput.disabled = false;
      };

      document.body.appendChild(script);

    } catch (error) {
      log("ERROR: " + (error.stack || error));
      setStatus("Could not start DOOM.");
      startButton.disabled = false;
      wadInput.disabled = false;
    }
  });
})();
</script>

</body>
</html>
