<body>
  <h1>DOOM</h1>
  <p>Classroom Arcade | Dwasm Web Player</p>

  <div class="toolbar">
    <label class="file-label" for="wadFile">
      Choose DOOM WAD
    </label>

    <input
      id="wadFile"
      type="file"
      accept=".wad,.WAD,application/octet-stream"
    >

    <button id="fullscreenButton" type="button">
      ⛶ Fullscreen
    </button>
  </div>

  <p id="status">
    Choose your DOOM.WAD or DOOM2.WAD file to start.
  </p>

  <div id="gameWrapper">
    <canvas id="game" width="640" height="480"></canvas>
  </div>

  <pre id="console"></pre>

  <script>
    const wadInput = document.getElementById("wadFile");
    const statusText = document.getElementById("status");
    const fullscreenButton =
      document.getElementById("fullscreenButton");
    const gameWrapper = document.getElementById("gameWrapper");
    const canvas = document.getElementById("game");
    const consoleOutput = document.getElementById("console");

    let engineStarted = false;

    function logMessage(message) {
      consoleOutput.textContent += String(message) + "\n";
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function resizeGame() {
      /*
       * Resize the display only. Do not overwrite canvas.width or
       * canvas.height here because the engine controls its render buffer.
       */
      window.dispatchEvent(new Event("resize"));
    }

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await gameWrapper.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        statusText.textContent =
          "Fullscreen could not start: " + error.message;
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent =
        document.fullscreenElement
          ? "⛶ Exit Fullscreen"
          : "⛶ Fullscreen";

      setTimeout(resizeGame, 100);
      setTimeout(resizeGame, 500);
    });

    window.addEventListener("resize", () => {
      // Let the browser apply the new CSS layout.
      requestAnimationFrame(() => {});
    });

    function startEngine(wadBytes, wadName) {
      if (engineStarted) {
        statusText.textContent =
          "The engine has already started. Reload the page to choose another WAD.";
        return;
      }

      engineStarted = true;
      statusText.textContent = "Loading " + wadName + "...";
      logMessage("Selected WAD: " + wadName);

      /*
       * Dwasm uses Emscripten's virtual filesystem. Place the selected
       * local WAD there before the engine starts.
       */
      window.localDoomWadBytes = new Uint8Array(wadBytes);

      window.Module = {
        canvas: canvas,

        arguments: ["-iwad", "/doom.wad"],

        print: function (text) {
          logMessage(text);
        },

        printErr: function (text) {
          logMessage("ERROR: " + text);
        },

        setStatus: function (text) {
          if (text) {
            statusText.textContent = text;
          }
        },

        preRun: [
          function () {
            try {
              if (!window.localDoomWadBytes) {
                throw new Error("No WAD file was selected.");
              }

              const FS = window.Module.FS;

              if (FS.analyzePath("/doom.wad").exists) {
                FS.unlink("/doom.wad");
              }

              FS.writeFile(
                "/doom.wad",
                window.localDoomWadBytes
              );

              logMessage("WAD loaded into the virtual filesystem.");
            } catch (error) {
              logMessage("WAD loading error: " + error.message);
              throw error;
            }
          }
        ],

        locateFile: function (path) {
          return "./" + path;
        },

        onRuntimeInitialized: function () {
          statusText.textContent =
            "DOOM engine loaded. Click the game to play.";
          setTimeout(resizeGame, 100);
        },

        onAbort: function (reason) {
          statusText.textContent = "Engine stopped: " + reason;
          logMessage("Engine stopped: " + reason);
        }
      };

      const script = document.createElement("script");
      script.src = "./index.js";

      script.onload = function () {
        logMessage("Dwasm engine script loaded.");
      };

      script.onerror = function () {
        statusText.textContent =
          "Could not load index.js. Check that index.js, index.data, and index.wasm are in the doom folder.";
        logMessage("Failed to load ./index.js");
        engineStarted = false;
      };

      document.body.appendChild(script);
    }

    wadInput.addEventListener("change", async function () {
      const file = wadInput.files && wadInput.files[0];

      if (!file) {
        return;
      }

      const lowerName = file.name.toLowerCase();

      if (!lowerName.endsWith(".wad")) {
        statusText.textContent =
          "Please select a .wad file.";
        wadInput.value = "";
        return;
      }

      try {
        const bytes = await file.arrayBuffer();
        startEngine(bytes, file.name);
      } catch (error) {
        statusText.textContent =
          "Could not read the WAD: " + error.message;
      }
    });
  </script>
</body>
</html>
