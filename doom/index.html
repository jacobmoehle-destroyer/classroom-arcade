<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom Arcade - DOOM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #171717;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 12px;

    }

    main {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      color: #e44b35;
      margin: 8px 0;
    }

    .panel {
      padding: 16px;
      margin: 12px auto;
      background: #262626;
      border: 1px solid #444;
      border-radius: 10px;
    }

    button, input {
      max-width: 100%;

    #gameArea {
      width: 100%;

      display: block;

      aspect-ratio: 4 / 3;
      max-width: 100%;
      object-fit: contain;
      background: #000;
      margin: 0 auto;
    }

    #gameArea:fullscreen {
      width: 100vw;
      height: 100vh;

      margin: 0;

    }

    #gameArea:fullscreen #game {
      width: 100% !important;

      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: auto;
      object-fit: contain;
    }

    #output {
      width: 100%;

      overflow: auto;

      display: none;

  </style>
</head>

<body>
<main>
  <h1>DOOM</h1>
  <p>Classroom Arcade | Dwasm Web Player</p>

  <section class="panel" id="launcher">
    <h2>Choose your DOOM WAD</h2>
    <p class="hint">
      Select a compatible WAD file from your device.
      It is read locally by your browser.
    </p>

    <input id="wadFile" type="file" accept=".wad,.WAD">
    <br>
    <button id="startButton" disabled>Start DOOM</button>
    <p id="status" role="status">Choose a WAD file to begin.</p>
  </section>

  <div id="gameControls">
    <button id="fullscreenButton">Fullscreen</button>
    <button id="exitFullscreenButton">Exit Fullscreen</button>
  </div>

  <div id="gameArea">
    <canvas id="game" oncontextmenu="event.preventDefault()"></canvas>
  </div>

  <h3>Game Log</h3>
  <pre id="output"></pre>
</main>

<script>
(function () {
  "use strict";

  const wadInput = document.getElementById("wadFile");
  const startButton = document.getElementById("startButton");
  const statusElement = document.getElementById("status");
  const outputElement = document.getElementById("output");
  const canvas = document.getElementById("game");
  const gameArea = document.getElementById("gameArea");
  const launcher = document.getElementById("launcher");
  const gameControls = document.getElementById("gameControls");

  let selectedWad = null;
  let engineStarted = false;

  function log(message) {
    outputElement.textContent += String(message) + "\n";
    outputElement.scrollTop = outputElement.scrollHeight;
  }

  function setStatus(message) {
    statusElement.textContent = message;
  }

  wadInput.addEventListener("change", function () {
    selectedWad = wadInput.files && wadInput.files[0];
    startButton.disabled = !selectedWad || engineStarted;

    if (selectedWad) {
      setStatus("Selected: " + selectedWad.name);
    } else {
      setStatus("Choose a WAD file to begin.");
    }
  });

  document.getElementById("fullscreenButton").addEventListener("click", async function () {
    try {
      if (gameArea.requestFullscreen) {
        await gameArea.requestFullscreen();
      }
    } catch (error) {
      log("Fullscreen error: " + error.message);
    }
  });

  document.getElementById("exitFullscreenButton").addEventListener("click", async function () {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    }
  });

  startButton.addEventListener("click", async function () {
    if (!selectedWad || engineStarted) return;

    startButton.disabled = true;
    wadInput.disabled = true;

    try {
      setStatus("Reading WAD...");
      const wadBytes = new Uint8Array(await selectedWad.arrayBuffer());

      if (wadBytes.length < 12) {
        throw new Error("The selected file is too small to be a WAD.");
      }

      const signature = String.fromCharCode(...wadBytes.slice(0, 4));
      if (signature !== "IWAD" && signature !== "PWAD") {
        throw new Error("This does not appear to be a valid WAD file.");
      }

      window.localDoomWadBytes = wadBytes;

      const engineBase = new URL("./", window.location.href);

      /*
       * Reveal the game area before initializing the renderer.
       * This gives the canvas a real, measurable size.
       */
      gameArea.style.display = "block";
      gameControls.style.display = "block";

      window.Module = {
        arguments: ["-iwad", "/doom.wad"],
        canvas: canvas,

        print: log,
        printErr: log,

        setStatus: function (message) {
          if (message) setStatus(message);
        },

        locateFile: function (path) {
          return new URL(path, engineBase).href;
        },

        preRun: [
          function () {
            const fs = typeof FS !== "undefined" ? FS : window.FS;

            if (!fs || typeof fs.writeFile !== "function") {
              throw new Error("Dwasm filesystem FS is not accessible.");
            }

            fs.writeFile("/doom.wad", window.localDoomWadBytes);
            log("WAD installed in the virtual filesystem.");
          }
        ],

        onAbort: function (reason) {
          log("Engine aborted: " + reason);
          setStatus("Engine stopped. Check the log.");
        },

        onRuntimeInitialized: function () {
          setStatus("DOOM is ready!");
          log("Engine initialized.");
        }
      };

      engineStarted = true;
      setStatus("Loading DOOM...");

      const script = document.createElement("script");
      script.src = new URL("index.js", engineBase).href;

      script.onload = function () {
        launcher.style.display = "none";
        setStatus("DOOM loaded.");
      };

      script.onerror = function () {
        log("Could not load index.js.");
        setStatus("Engine loading failed.");
        engineStarted = false;
        startButton.disabled = false;
        wadInput.disabled = false;
      };

      document.body.appendChild(script);

    } catch (error) {
      log("ERROR: " + (error.stack || error));
      setStatus("Could not start DOOM.");
      startButton.disabled = false;
      wadInput.disabled = false;
    }
  });
})();
</script>
</body>
</html>
