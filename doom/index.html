
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Classroom Arcade | DOOM</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  min-height: 100%;
  width: 100%;
  background: #111;
  color: #eee;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

body { padding: 10px; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}

h1 { margin: 0; font-size: 20px; }

button, .fileLabel {
  background: #292929;
  color: white;
  border: 1px solid #666;
  border-radius: 8px;
  padding: 10px 13px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  touch-action: manipulation;
}

button:active, .fileLabel:active { background: #555; }

button:disabled { opacity: .5; cursor: wait; }

#gameWrapper {
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  position: relative;
  background: #000;
  overflow: hidden;
  border: 1px solid #444;
  border-radius: 5px;
  aspect-ratio: 4 / 3;
}

#game {
  display: block;
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
  background: #000;
  outline: none;
  touch-action: none;
}

#touchControls {
  width: 100%;
  max-width: 960px;
  margin: 12px auto 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  user-select: none;
  -webkit-user-select: none;
}

.controlGroup {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 0;
}

.controlTitle {
  color: #bbb;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.dpad {
  display: grid;
  grid-template-columns: repeat(3, minmax(45px, 64px));
  grid-template-rows: repeat(2, 52px);
  gap: 5px;
}

.touchButton {
  min-width: 0;
  min-height: 48px;
  padding: 8px;
  font-size: 16px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#moveUp { grid-column: 2; grid-row: 1; }
#moveLeft { grid-column: 1; grid-row: 2; }
#moveDown { grid-column: 2; grid-row: 2; }
#moveRight { grid-column: 3; grid-row: 2; }

.actionGrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(70px, 105px));
  gap: 7px;
  justify-content: center;
}

.actionGrid button { min-height: 46px; }

#status {
  max-width: 960px;
  margin: 10px auto;
  color: #bbb;
  font-size: 12px;
  overflow-wrap: anywhere;
}

#fileInput { display: none; }

#bottomButtons {
  max-width: 960px;
  margin: 12px auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

@media (max-width: 480px) {
  body { padding: 5px; }
  h1 { font-size: 17px; }
  #touchControls { gap: 5px; }

  .dpad {
    grid-template-columns: repeat(3, minmax(36px, 52px));
    grid-template-rows: repeat(2, 48px);
    gap: 4px;
  }

  .touchButton { min-height: 44px; font-size: 14px; padding: 5px; }

  .actionGrid {
    grid-template-columns: repeat(2, minmax(60px, 88px));
    gap: 5px;
  }

  .actionGrid button { padding: 7px 4px; font-size: 12px; }
}

@media (orientation: landscape) and (max-height: 550px) {
  body { padding: 4px; }
  header { margin-bottom: 4px; }

  #gameWrapper {
    max-width: min(72vw, 960px);
    max-height: 70vh;
  }

  #touchControls { margin-top: 5px; }
  .dpad { grid-template-rows: repeat(2, 40px); }

  .touchButton, .actionGrid button { min-height: 38px; }
}
</style>
</head>

<body>

<header>
  <h1>Classroom Arcade | DOOM</h1>
  <button id="fullscreenButton" type="button">FULLSCREEN</button>
</header>

<div id="gameWrapper">
  <canvas id="game" width="640" height="480" tabindex="0"></canvas>
</div>

<div id="touchControls">
  <div class="controlGroup">
    <div class="controlTitle">Move and turn</div>
    <div class="dpad">
      <button class="touchButton" id="moveUp" data-key="ArrowUp" aria-label="Move forward">▲</button>
      <button class="touchButton" id="moveLeft" data-key="ArrowLeft" aria-label="Turn left">◀</button>
      <button class="touchButton" id="moveDown" data-key="ArrowDown" aria-label="Move backward">▼</button>
      <button class="touchButton" id="moveRight" data-key="ArrowRight" aria-label="Turn right">▶</button>
    </div>
  </div>

  <div class="controlGroup">
    <div class="controlTitle">Actions</div>
    <div class="actionGrid">
      <button class="touchButton" data-key=" " id="useButton">USE</button>
      <button class="touchButton" data-key="Control" id="fireButton">FIRE</button>
      <button class="touchButton" data-key="Shift" id="runButton">RUN</button>
      <button class="touchButton" data-key="Escape" id="menuButton">MENU</button>
      <button class="touchButton" data-key="Enter" id="enterButton">ENTER</button>
      <button class="touchButton" data-key="Tab" id="mapButton">MAP</button>
    </div>
  </div>
</div>

<div id="bottomButtons">
  <label class="fileLabel" for="fileInput">CHOOSE WAD FILE</label>
  <input id="fileInput" type="file" accept=".wad,.WAD">
  <button id="startButton" type="button">START DOOM</button>
  <button id="restartButton" type="button">RESTART DOOM</button>
  <button id="backButton" type="button">BACK TO ARCADE</button>
</div>

<div id="status">Loading DOOM engine…</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const wrapper = document.getElementById("gameWrapper");
const statusBox = document.getElementById("status");
const fileInput = document.getElementById("fileInput");
const startButton = document.getElementById("startButton");

let selectedWad = null;
let selectedWadName = "";
let engineStarted = false;
let engineLoading = false;

const activePointers = new Map();
const keyCounts = new Map();

const keyInfo = {
  "ArrowUp":    { key: "ArrowUp", code: "ArrowUp", keyCode: 38 },
  "ArrowDown":  { key: "ArrowDown", code: "ArrowDown", keyCode: 40 },
  "ArrowLeft":  { key: "ArrowLeft", code: "ArrowLeft", keyCode: 37 },
  "ArrowRight": { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
  " ":          { key: " ", code: "Space", keyCode: 32 },
  "Control":    { key: "Control", code: "ControlLeft", keyCode: 17 },
  "Shift":      { key: "Shift", code: "ShiftLeft", keyCode: 16 },
  "Escape":     { key: "Escape", code: "Escape", keyCode: 27 },
  "Enter":      { key: "Enter", code: "Enter", keyCode: 13 },
  "Tab":        { key: "Tab", code: "Tab", keyCode: 9 }
};

function status(message) {
  statusBox.textContent = message;
}

/* Keep the working 4:3 game display and correct the GL viewport. */
function correctViewport() {
  const glObject = canvas.GLctxObject;
  const gl = glObject && glObject.GLctx;
  if (!gl) return;

  const width = gl.drawingBufferWidth || canvas.width;
  const height = gl.drawingBufferHeight || canvas.height;

  if (width > 0 && height > 0) {
    gl.viewport(0, 0, width, height);
  }
}

function resizeGame() {
  canvas.style.width = "100%";
  canvas.style.height = "100%";
  correctViewport();
  requestAnimationFrame(correctViewport);
}

window.addEventListener("resize", resizeGame);
window.addEventListener("orientationchange", () => {
  setTimeout(resizeGame, 250);
  setTimeout(resizeGame, 700);
});

function createKeyEvent(type, keyName) {
  const info = keyInfo[keyName] || {
    key: keyName,
    code: keyName,
    keyCode: 0
  };

  const event = new KeyboardEvent(type, {
    key: info.key,
    code: info.code,
    bubbles: true,
    cancelable: true,
    composed: true
  });

  for (const prop of ["keyCode", "which", "charCode"]) {
    try {
      Object.defineProperty(event, prop, {
        get: () => info.keyCode
      });
    } catch (_) {}
  }

  return event;
}

function dispatchKey(type, keyName) {
  /*
   * Keep the same multi-target dispatch method as the existing
   * version because it was able to turn left and right.
   */
  canvas.dispatchEvent(createKeyEvent(type, keyName));
  document.dispatchEvent(createKeyEvent(type, keyName));
  window.dispatchEvent(createKeyEvent(type, keyName));
}

function pressKey(pointerId, keyName) {
  if (activePointers.has(pointerId)) return;

  activePointers.set(pointerId, keyName);

  const count = keyCounts.get(keyName) || 0;
  keyCounts.set(keyName, count + 1);

  if (count === 0) dispatchKey("keydown", keyName);
}

function releaseKey(pointerId) {
  if (!activePointers.has(pointerId)) return;

  const keyName = activePointers.get(pointerId);
  activePointers.delete(pointerId);

  const count = keyCounts.get(keyName) || 0;

  if (count <= 1) {
    keyCounts.delete(keyName);
    dispatchKey("keyup", keyName);
  } else {
    keyCounts.set(keyName, count - 1);
  }
}

function releaseAllKeys() {
  for (const pointerId of [...activePointers.keys()]) {
    releaseKey(pointerId);
  }
}

document.querySelectorAll(".touchButton[data-key]").forEach(button => {
  button.addEventListener("contextmenu", event => event.preventDefault());

  button.addEventListener("pointerdown", event => {
    event.preventDefault();

    try {
      button.setPointerCapture(event.pointerId);
    } catch (_) {}

    canvas.focus({ preventScroll: true });
    pressKey(event.pointerId, button.dataset.key);
  });

  const stop = event => {
    event.preventDefault();
    releaseKey(event.pointerId);
  };

  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
});

window.addEventListener("blur", releaseAllKeys);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) releaseAllKeys();
});

/* Physical keyboard input remains available. */
document.addEventListener("keydown", event => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
    event.preventDefault();
  }
}, { passive: false });

document.addEventListener("keyup", event => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
    event.preventDefault();
  }
}, { passive: false });

document.getElementById("fullscreenButton").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await wrapper.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
    setTimeout(resizeGame, 100);
  } catch (_) {
    status("Fullscreen isn't available in this browser.");
  }
});

document.getElementById("backButton").addEventListener("click", () => {
  window.location.href = "/classroom-arcade/";
});

fileInput.addEventListener("change", async event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  if (!/\.wad$/i.test(file.name)) {
    status("Please choose a .wad file.");
    return;
  }

  try {
    selectedWad = new Uint8Array(await file.arrayBuffer());
    selectedWadName = file.name;
    status("Selected " + file.name + ". Press START DOOM to load it.");
    startButton.disabled = false;
  } catch (_) {
    status("Couldn't read that WAD file.");
  }
});

/*
 * The WAD must be selected BEFORE the engine starts so it can be
 * installed during Emscripten's preRun phase.
 */
function configureModule() {
  const moduleConfig = {
    canvas: canvas,
    arguments: ["-iwad", "/doom.wad"],
    print: message => console.log(message),
    printErr: message => console.error(message),
    setStatus: message => {
      if (message) status(message);
    },
    onRuntimeInitialized: () => {
      engineStarted = true;
      engineLoading = false;
      startButton.disabled = false;
      status("DOOM is ready. Tap the game, then use the controls.");
      resizeGame();
    },
    onAbort: reason => {
      engineLoading = false;
      startButton.disabled = false;
      status("DOOM engine stopped: " + reason);
    }
  };

  if (selectedWad) {
    moduleConfig.preRun = [function() {
      try {
        /*
         * Some builds expose FS through Module; others do not.
         * Never silently claim a custom WAD loaded if FS is missing.
         */
        if (window.Module && Module.FS &&
            typeof Module.FS.writeFile === "function") {
          try { Module.FS.unlink("/doom.wad"); } catch (_) {}
          Module.FS.writeFile("/doom.wad", selectedWad);
        } else if (window.Module &&
                   typeof Module.FS_createDataFile === "function") {
          try { Module.FS_unlink("/doom.wad"); } catch (_) {}
          Module.FS_createDataFile("/", "doom.wad", selectedWad, true, true, true);
        } else {
          console.warn("This engine build does not expose its filesystem for WAD replacement.");
          status("Custom WAD selected, but this engine build may not support replacing its bundled WAD.");
        }
      } catch (error) {
        console.error("WAD setup failed:", error);
        status("Couldn't install the selected WAD. Try the bundled game WAD.");
      }
    }];
  }

  return moduleConfig;
}

function startEngine() {
  if (engineStarted || engineLoading) {
    status("DOOM is already running or loading.");
    return;
  }

  engineLoading = true;
  startButton.disabled = true;

  if (selectedWadName) {
    status("Starting DOOM with " + selectedWadName + "…");
  } else {
    status("Starting DOOM with the game's bundled WAD…");
  }

  window.Module = configureModule();

  const script = document.createElement("script");
  script.src = "./index.js";
  script.async = true;

  script.onload = () => {
    resizeGame();
    if (engineLoading) {
      status("Engine script loaded. Waiting for DOOM to initialize…");
    }
  };

  script.onerror = () => {
    engineLoading = false;
    startButton.disabled = false;
    status("Couldn't load ./index.js. Check that index.js, index.wasm, and index.data are in the DOOM folder.");
  };

  document.body.appendChild(script);
}

startButton.addEventListener("click", startEngine);

/*
 * A running Emscripten game cannot safely be restarted just by
 * injecting the script a second time. Try its exposed main entry
 * if the build provides one; otherwise leave the current game alive.
 */
document.getElementById("restartButton").addEventListener("click", () => {
  releaseAllKeys();

  if (window.Module && typeof Module.callMain === "function") {
    try {
      Module.callMain(["-iwad", "/doom.wad"]);
      status("Sent a restart request to the DOOM engine.");
      return;
    } catch (error) {
      console.warn("Engine restart entry point failed:", error);
    }
  }

  status("This build doesn't expose an in-place restart function. Use DOOM's in-game menu to restart the level; the page was not reloaded.");
});

window.addEventListener("load", () => {
  resizeGame();

  /*
   * Start the bundled game automatically, as before.
   * To use a different WAD, choose it and start from a fresh page
   * before the engine has initialized.
   */
  startEngine();
});
</script>

</body>
</html>
