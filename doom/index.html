
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>Classroom Arcade | DOOM</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  min-height: 100%;
  width: 100%;
  background: #111;
  color: #eee;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

body {
  padding: 10px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
  font-size: 20px;
}

button, .fileLabel {
  background: #292929;
  color: white;
  border: 1px solid #666;
  border-radius: 8px;
  padding: 10px 13px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  touch-action: manipulation;
}

button:active, .fileLabel:active {
  background: #555;
}

#gameWrapper {
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  position: relative;
  background: #000;
  overflow: hidden;
  border: 1px solid #444;
  border-radius: 5px;
  aspect-ratio: 4 / 3;
}

#game {
  display: block;
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
  background: #000;
  object-fit: fill;
  outline: none;
  touch-action: none;
}

#touchControls {
  width: 100%;
  max-width: 960px;
  margin: 12px auto 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  user-select: none;
  -webkit-user-select: none;
}

.controlGroup {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 0;
}

.controlTitle {
  color: #bbb;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.dpad {
  display: grid;
  grid-template-columns: repeat(3, minmax(45px, 64px));
  grid-template-rows: repeat(2, 52px);
  gap: 5px;
}

.touchButton {
  min-width: 0;
  min-height: 48px;
  padding: 8px;
  font-size: 16px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#moveUp {
  grid-column: 2;
  grid-row: 1;
}

#moveLeft {
  grid-column: 1;
  grid-row: 2;
}

#moveDown {
  grid-column: 2;
  grid-row: 2;
}

#moveRight {
  grid-column: 3;
  grid-row: 2;
}

.actionGrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(70px, 105px));
  gap: 7px;
  justify-content: center;
}

.actionGrid button {
  min-height: 46px;
  touch-action: none;
}

#status {
  max-width: 960px;
  margin: 10px auto;
  color: #bbb;
  font-size: 12px;
  overflow-wrap: anywhere;
}

#fileInput {
  display: none;
}

#bottomButtons {
  max-width: 960px;
  margin: 12px auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

@media (max-width: 480px) {
  body {
    padding: 5px;
  }

  h1 {
    font-size: 17px;
  }

  #gameWrapper {
    width: 100%;
  }

  #touchControls {
    gap: 5px;
  }

  .dpad {
    grid-template-columns: repeat(3, minmax(36px, 52px));
    grid-template-rows: repeat(2, 48px);
    gap: 4px;
  }

  .touchButton {
    min-height: 44px;
    font-size: 14px;
    padding: 5px;
  }

  .actionGrid {
    grid-template-columns: repeat(2, minmax(60px, 88px));
    gap: 5px;
  }

  .actionGrid button {
    padding: 7px 4px;
    font-size: 12px;
  }
}

@media (orientation: landscape) and (max-height: 550px) {
  body {
    padding: 4px;
  }

  header {
    margin-bottom: 4px;
  }

  #gameWrapper {
    max-width: min(72vw, 960px);
    max-height: 70vh;
  }

  #touchControls {
    margin-top: 5px;
  }

  .dpad {
    grid-template-rows: repeat(2, 40px);
  }

  .touchButton,
  .actionGrid button {
    min-height: 38px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Classroom Arcade | DOOM</h1>
  <button id="fullscreenButton" type="button">FULLSCREEN</button>
</header>

<div id="gameWrapper">
  <canvas id="game" width="640" height="480" tabindex="0"></canvas>
</div>

<div id="touchControls">

  <div class="controlGroup">
    <div class="controlTitle">Move and turn</div>

    <div class="dpad">
      <button class="touchButton" id="moveUp"
              data-key="w" aria-label="Move forward">▲</button>

      <button class="touchButton" id="moveLeft"
              data-key="ArrowLeft" aria-label="Turn left">◀</button>

      <button class="touchButton" id="moveDown"
              data-key="s" aria-label="Move backward">▼</button>

      <button class="touchButton" id="moveRight"
              data-key="ArrowRight" aria-label="Turn right">▶</button>
    </div>
  </div>

  <div class="controlGroup">
    <div class="controlTitle">Actions</div>

    <div class="actionGrid">
      <button class="touchButton" id="useButton"
              data-key=" " >USE</button>

      <button class="touchButton" id="fireButton"
              data-key="Control">FIRE</button>

      <button class="touchButton" id="runButton"
              data-key="Shift">RUN</button>

      <button class="touchButton" id="menuButton"
              data-key="Escape">MENU</button>

      <button class="touchButton" id="enterButton"
              data-key="Enter">ENTER</button>

      <button class="touchButton" id="mapButton"
              data-key="Tab">MAP</button>
    </div>
  </div>

</div>

<div id="bottomButtons">
  <label class="fileLabel" for="fileInput">CHOOSE WAD FILE</label>
  <input id="fileInput" type="file" accept=".wad,.WAD">

  <button id="reloadButton" type="button">RELOAD GAME</button>
  <button id="backButton" type="button">BACK TO ARCADE</button>
</div>

<div id="status">Choose a compatible WAD file, then wait for DOOM to load.</div>

<script>
"use strict";

const gameCanvas = document.getElementById("game");
const gameWrapper = document.getElementById("gameWrapper");
const statusElement = document.getElementById("status");
const fileInput = document.getElementById("fileInput");

let selectedWadBuffer = null;
let selectedWadName = "";
let engineStarted = false;
let engineScriptAdded = false;

const heldPointers = new Map();
const heldKeyCounts = new Map();

const keyInfo = {
  "w":         { key: "w", code: "KeyW", keyCode: 87 },
  "s":         { key: "s", code: "KeyS", keyCode: 83 },
  "ArrowLeft": { key: "ArrowLeft", code: "ArrowLeft", keyCode: 37 },
  "ArrowRight":{ key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
  "ArrowUp":   { key: "ArrowUp", code: "ArrowUp", keyCode: 38 },
  "ArrowDown": { key: "ArrowDown", code: "ArrowDown", keyCode: 40 },
  " ":         { key: " ", code: "Space", keyCode: 32 },
  "Control":   { key: "Control", code: "ControlLeft", keyCode: 17 },
  "Shift":     { key: "Shift", code: "ShiftLeft", keyCode: 16 },
  "Escape":    { key: "Escape", code: "Escape", keyCode: 27 },
  "Enter":     { key: "Enter", code: "Enter", keyCode: 13 },
  "Tab":       { key: "Tab", code: "Tab", keyCode: 9 }
};

function updateStatus(message) {
  statusElement.textContent = message;
}

function correctViewport() {
  const glObject = gameCanvas.GLctxObject;
  const gl = glObject && glObject.GLctx;

  if (!gl) return;

  const width = gl.drawingBufferWidth || gameCanvas.width;
  const height = gl.drawingBufferHeight || gameCanvas.height;

  if (width > 0 && height > 0) {
    gl.viewport(0, 0, width, height);
  }
}

function resizeGame() {
  if (!gameCanvas || !gameWrapper) return;

  gameCanvas.style.width = "100%";
  gameCanvas.style.height = "100%";

  correctViewport();
  requestAnimationFrame(correctViewport);
}

window.addEventListener("resize", resizeGame);
window.addEventListener("orientationchange", () => {
  setTimeout(resizeGame, 250);
  setTimeout(resizeGame, 700);
});

function makeKeyboardEvent(type, keyName) {
  const info = keyInfo[keyName] || {
    key: keyName,
    code: keyName,
    keyCode: 0
  };

  const event = new KeyboardEvent(type, {
    key: info.key,
    code: info.code,
    bubbles: true,
    cancelable: true,
    composed: true,
    repeat: false
  });

  for (const property of ["keyCode", "which", "charCode"]) {
    try {
      Object.defineProperty(event, property, {
        get: () => info.keyCode
      });
    } catch (_) {}
  }

  return event;
}

function dispatchKey(type, keyName) {
  const event = makeKeyboardEvent(type, keyName);

  gameCanvas.dispatchEvent(event);
  document.dispatchEvent(makeKeyboardEvent(type, keyName));
  window.dispatchEvent(makeKeyboardEvent(type, keyName));
}

function pressKey(pointerId, keyName) {
  if (heldPointers.has(pointerId)) return;

  heldPointers.set(pointerId, keyName);

  const count = heldKeyCounts.get(keyName) || 0;
  heldKeyCounts.set(keyName, count + 1);

  if (count === 0) {
    dispatchKey("keydown", keyName);
  }
}

function releaseKey(pointerId) {
  if (!heldPointers.has(pointerId)) return;

  const keyName = heldPointers.get(pointerId);
  heldPointers.delete(pointerId);

  const count = heldKeyCounts.get(keyName) || 0;

  if (count <= 1) {
    heldKeyCounts.delete(keyName);
    dispatchKey("keyup", keyName);
  } else {
    heldKeyCounts.set(keyName, count - 1);
  }
}

function releaseAllKeys() {
  for (const pointerId of [...heldPointers.keys()]) {
    releaseKey(pointerId);
  }
}

document.querySelectorAll(".touchButton[data-key]").forEach(button => {
  button.addEventListener("contextmenu", event => {
    event.preventDefault();
  });

  button.addEventListener("pointerdown", event => {
    event.preventDefault();

    try {
      button.setPointerCapture(event.pointerId);
    } catch (_) {}

    const keyName = button.dataset.key;

    if (button.id === "menuButton") {
      /*
       * Try Enter first for menu/select, then Escape.
       * This is a compatibility attempt; some WASM engines
       * ignore synthetic keyboard events.
       */
      pressKey(event.pointerId, "Enter");
      setTimeout(() => releaseKey(event.pointerId), 50);

      setTimeout(() => {
        const temporaryId = "menu-" + Date.now();

        pressKey(temporaryId, "Escape");
        setTimeout(() => releaseKey(temporaryId), 70);
      }, 120);

      return;
    }

    pressKey(event.pointerId, keyName);
  });

  const stopPointer = event => {
    event.preventDefault();
    releaseKey(event.pointerId);
  };

  button.addEventListener("pointerup", stopPointer);
  button.addEventListener("pointercancel", stopPointer);
  button.addEventListener("lostpointercapture", stopPointer);
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) releaseAllKeys();
});

window.addEventListener("blur", releaseAllKeys);

document.getElementById("fullscreenButton").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await gameWrapper.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    updateStatus("Fullscreen isn't available in this browser.");
  }

  setTimeout(resizeGame, 100);
});

document.getElementById("backButton").addEventListener("click", () => {
  window.location.href = "/classroom-arcade/";
});

fileInput.addEventListener("change", async event => {
  const file = event.target.files && event.target.files[0];

  if (!file) return;

  if (!/\.wad$/i.test(file.name)) {
    updateStatus("Please choose a .wad file.");
    return;
  }

  try {
    selectedWadBuffer = await file.arrayBuffer();
    selectedWadName = file.name;

    updateStatus(
      "Selected " + selectedWadName +
      ". Reload the game to start with this WAD."
    );
  } catch (error) {
    updateStatus("Couldn't read that WAD file.");
  }
});

document.getElementById("reloadButton").addEventListener("click", () => {
  window.location.reload();
});

function installWad(Module) {
  if (!selectedWadBuffer) return;

  const bytes = new Uint8Array(selectedWadBuffer);

  Module.preRun = Module.preRun || [];

  Module.preRun.push(function() {
    try {
      if (typeof Module.FS_unlink === "function") {
        try {
          Module.FS_unlink("/doom.wad");
        } catch (_) {}
      }

      if (typeof Module.FS_createDataFile === "function") {
        Module.FS_createDataFile(
          "/",
          "doom.wad",
          bytes,
          true,
          true,
          true
        );
      } else if (Module.FS && typeof Module.FS.writeFile === "function") {
        Module.FS.writeFile("/doom.wad", bytes);
      } else {
        console.warn("WAD filesystem interface unavailable.");
      }
    } catch (error) {
      console.error("Could not install selected WAD:", error);
    }
  });
}

function startEngine() {
  if (engineStarted) return;
  engineStarted = true;

  window.Module = window.Module || {};
  Module.canvas = gameCanvas;
  Module.arguments = ["-iwad", "/doom.wad"];
  Module.print = function(text) {
    console.log(text);
  };
  Module.printErr = function(text) {
    console.error(text);
  };
  Module.setStatus = function(text) {
    if (text) updateStatus(text);
  };
  Module.onRuntimeInitialized = function() {
    updateStatus("DOOM loaded. Use the touch controls to play.");
    resizeGame();
  };
  Module.onAbort = function(reason) {
    updateStatus("DOOM stopped: " + reason);
  };

  installWad(Module);

  if (engineScriptAdded) return;
  engineScriptAdded = true;

  const script = document.createElement("script");
  script.src = "./index.js";
  script.async = true;

  script.onload = function() {
    updateStatus("DOOM engine loaded. If the game stays black, check the WAD file.");
    resizeGame();
  };

  script.onerror = function() {
    updateStatus("Couldn't load index.js. Check the DOOM folder files.");
  };

  document.body.appendChild(script);
}

window.addEventListener("load", () => {
  resizeGame();

  if (selectedWadBuffer) {
    startEngine();
  } else {
    updateStatus(
      "Choose a compatible WAD file. The default game WAD must also be available to the engine."
    );
  }
});

/*
 * Keyboard support for physical keyboards remains enabled.
 */
document.addEventListener("keydown", event => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
    event.preventDefault();
  }
}, { passive: false });

document.addEventListener("keyup", event => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
    event.preventDefault();
  }
}, { passive: false });
</script>

</body>
</html>
