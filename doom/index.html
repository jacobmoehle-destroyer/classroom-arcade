
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Classroom Arcade | DOOM</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #111;
  color: #eee;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding: 14px;
  text-align: center;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
  color: #fff;
  background: #292929;
  border: 1px solid #555;
  border-radius: 7px;
  padding: 8px 12px;
}

button:hover {
  background: #3b3b3b;
}

button:active {
  background: #555;
}

#pageHeader {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto 12px;
}

h1 {
  font-size: 25px;
  margin: 0 0 5px;
}

#subtitle {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 12px;
}

#launcher {
  max-width: 960px;
  margin: 0 auto 12px;
  padding: 12px;
  background: #1b1b1b;
  border: 1px solid #333;
  border-radius: 10px;
}

#launcher label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

#wadPicker {
  display: block;
  max-width: 100%;
  margin: 0 auto 10px;
  font-size: 13px;
}

#launcherButtons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
}

#startButton {
  background: #792020;
  border-color: #a44;
  font-weight: bold;
}

#status {
  min-height: 18px;
  margin-top: 9px;
  font-size: 12px;
  color: #bbb;
  overflow-wrap: anywhere;
}

/* Main game stays a reasonable size on desktop. */
#gameWrapper {
  position: relative;
  width: min(100%, 960px);
  margin: 0 auto;
  aspect-ratio: 4 / 3;
  max-height: 72vh;
  background: #000;
  border: 1px solid #444;
  border-radius: 5px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#game {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* Buttons that are always available below the game. */
#gameToolbar {
  width: min(100%, 960px);
  margin: 10px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

#controlsToggle {
  background: #24412a;
  border-color: #477b50;
}

#console {
  width: min(100%, 960px);
  height: 65px;
  margin: 12px auto;
  padding: 8px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  text-align: left;
  font: 11px/1.4 monospace;
  color: #bdbdbd;
  background: #080808;
  border: 1px solid #333;
  border-radius: 5px;
}

/* Small, translucent controls float over the game.
   They never take up a separate row of screen space. */
#touchControls {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

#touchControls.hidden {
  display: none;
}

.controlCluster {
  position: absolute;
  display: grid;
  gap: 4px;
  pointer-events: auto;
}

#movementPad {
  left: 8px;
  bottom: 8px;
  grid-template-columns: repeat(3, 34px);
  grid-template-rows: repeat(2, 34px);
}

#actionPad {
  right: 8px;
  bottom: 8px;
  grid-template-columns: repeat(2, 38px);
  grid-template-rows: repeat(2, 34px);
}

.touchButton {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  color: white;
  background: rgba(30, 30, 30, 0.58);
  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: 7px;
  font-size: 15px;
  font-weight: bold;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  touch-action: none;
}

.touchButton.pressed,
.touchButton:active {
  background: rgba(180, 45, 30, 0.8);
}

#moveUp {
  grid-column: 2;
  grid-row: 1;
}

#moveLeft {
  grid-column: 1;
  grid-row: 2;
}

#moveDown {
  grid-column: 2;
  grid-row: 2;
}

#moveRight {
  grid-column: 3;
  grid-row: 2;
}

#fireButton {
  grid-column: 2;
  grid-row: 1 / span 2;
  font-size: 11px;
}

#useButton {
  grid-column: 1;
  grid-row: 1;
  font-size: 11px;
}

#runButton {
  grid-column: 1;
  grid-row: 2;
  font-size: 11px;
}

#fireButton {
  grid-column: 2;
  grid-row: 1 / span 2;
}

/* Fullscreen uses the whole display, but normal mode stays compact. */
#gameWrapper:fullscreen {
  width: 100vw;
  height: 100vh;
  max-height: none;
  max-width: none;
  aspect-ratio: auto;
  border: 0;
  border-radius: 0;
}

#gameWrapper:fullscreen #game {
  width: 100%;
  height: 100%;
}

#gameWrapper:fullscreen #movementPad {
  left: max(12px, env(safe-area-inset-left));
  bottom: max(12px, env(safe-area-inset-bottom));
}

#gameWrapper:fullscreen #actionPad {
  right: max(12px, env(safe-area-inset-right));
  bottom: max(12px, env(safe-area-inset-bottom));
}

/* Narrow windows and phones. */
@media (max-width: 600px) {
  body {
    padding: 6px;
  }

  #pageHeader {
    margin-bottom: 8px;
  }

  h1 {
    font-size: 20px;
  }

  #launcher {
    padding: 9px;
    margin-bottom: 8px;
  }

  #gameWrapper {
    width: 100%;
    max-height: 65vh;
  }

  #console {
    height: 45px;
  }
}

/* Landscape tablets/phones: prioritize the game display. */
@media (orientation: landscape) and (max-height: 600px) {
  body {
    padding: 4px;
  }

  #pageHeader {
    display: none;
  }

  #launcher {
    padding: 5px;
    margin-bottom: 5px;
  }

  #launcher label {
    display: inline-block;
    margin: 0 6px 0 0;
    font-size: 12px;
  }

  #wadPicker {
    display: inline-block;
    width: 190px;
    margin: 0 5px;
  }

  #launcherButtons {
    display: inline-flex;
  }

  #launcher button {
    padding: 5px 8px;
    font-size: 12px;
  }

  #status {
    min-height: 0;
    margin-top: 4px;
  }

  #gameWrapper {
    width: auto;
    height: calc(100dvh - 75px);
    max-height: none;
    max-width: 100%;
    aspect-ratio: 4 / 3;
  }

  #gameToolbar {
    margin: 4px auto;
  }

  #console {
    display: none;
  }

  #movementPad {
    transform: scale(0.9);
    transform-origin: bottom left;
  }

  #actionPad {
    transform: scale(0.9);
    transform-origin: bottom right;
  }
}
</style>
</head>

<body>

<header id="pageHeader">
  <h1>CLASSROOM ARCADE: DOOM</h1>
  <div id="subtitle">Dwasm browser player</div>
</header>

<section id="launcher">
  <label for="wadPicker">Choose a DOOM WAD file</label>
  <input id="wadPicker" type="file" accept=".wad,.WAD">

  <div id="launcherButtons">
    <button id="startButton" type="button">Load / Restart DOOM</button>
    <button id="backButton" type="button">Back to Arcade</button>
  </div>

  <div id="status">Choose a compatible IWAD file, then select Load / Restart DOOM.</div>
</section>

<main>
  <div id="gameWrapper">
    <canvas id="game" oncontextmenu="event.preventDefault()"></canvas>

    <div id="touchControls" class="hidden" aria-label="Touch controls">
      <div id="movementPad" class="controlCluster">
        <button class="touchButton" id="moveUp" data-key="ArrowUp" aria-label="Move forward">▲</button>
        <button class="touchButton" id="moveLeft" data-key="ArrowLeft" aria-label="Turn left">◀</button>
        <button class="touchButton" id="moveDown" data-key="ArrowDown" aria-label="Move backward">▼</button>
        <button class="touchButton" id="moveRight" data-key="ArrowRight" aria-label="Turn right">▶</button>
      </div>

      <div id="actionPad" class="controlCluster">
        <button class="touchButton" id="useButton" data-key=" " aria-label="Use">USE</button>
        <button class="touchButton" id="fireButton" data-key="Control" aria-label="Fire">FIRE</button>
        <button class="touchButton" id="runButton" data-key="Shift" aria-label="Run">RUN</button>
      </div>
    </div>
  </div>

  <div id="gameToolbar">
    <button id="controlsToggle" type="button">Show Controls</button>
    <button id="fullscreenButton" type="button">Fullscreen</button>
  </div>

  <pre id="console">Dwasm output will appear here.</pre>
</main>

<script>
(() => {
  "use strict";

  const wadPicker = document.getElementById("wadPicker");
  const startButton = document.getElementById("startButton");
  const backButton = document.getElementById("backButton");
  const statusBox = document.getElementById("status");
  const consoleBox = document.getElementById("console");
  const gameWrapper = document.getElementById("gameWrapper");
  const gameCanvas = document.getElementById("game");
  const touchControls = document.getElementById("touchControls");
  const controlsToggle = document.getElementById("controlsToggle");
  const fullscreenButton = document.getElementById("fullscreenButton");

  let selectedWad = null;
  let engineStarted = false;
  let loading = false;
  let activePointers = new Map();

  function setStatus(message) {
    statusBox.textContent = message;
  }

  function log(message) {
    const line = String(message);
    consoleBox.textContent += "\n" + line;
    consoleBox.scrollTop = consoleBox.scrollHeight;
  }

  consoleBox.textContent = "Dwasm output will appear here.";

  wadPicker.addEventListener("change", () => {
    selectedWad = wadPicker.files && wadPicker.files[0]
      ? wadPicker.files[0]
      : null;

    if (selectedWad) {
      setStatus("Selected WAD: " + selectedWad.name);
    } else {
      setStatus("Choose a compatible IWAD file.");
    }
  });

  /*
   * Controls start hidden on a typical computer and visible on
   * touch-first devices. The toggle works on both.
   */
  function isTouchDevice() {
    return (
      window.matchMedia("(pointer: coarse)").matches ||
      navigator.maxTouchPoints > 0
    );
  }

  let controlsVisible = isTouchDevice();

  function updateControlsVisibility() {
    touchControls.classList.toggle("hidden", !controlsVisible);
    controlsToggle.textContent = controlsVisible
      ? "Hide Controls"
      : "Show Controls";
    controlsToggle.setAttribute("aria-pressed", String(controlsVisible));

    if (!controlsVisible) {
      releaseAllControls();
    }
  }

  controlsToggle.addEventListener("click", () => {
    controlsVisible = !controlsVisible;
    updateControlsVisibility();
  });

  updateControlsVisibility();

  /*
   * Send key events to the document, where the working Dwasm
   * keyboard input handlers can receive them.
   */
  function sendKey(key, type) {
    const keyCodeMap = {
      ArrowUp: 38,
      ArrowDown: 40,
      ArrowLeft: 37,
      ArrowRight: 39,
      Control: 17,
      Shift: 16,
      " ": 32
    };

    const letter = key.length === 1 ? key.toLowerCase() : "";
    const codeMap = {
      w: "KeyW",
      a: "KeyA",
      s: "KeyS",
      d: "KeyD",
      " ": "Space"
    };

    const event = new KeyboardEvent(type, {
      key: key,
      code: codeMap[letter] || codeMap[key] || key,
      keyCode: keyCodeMap[key] || (letter ? letter.charCodeAt(0) : 0),
      which: keyCodeMap[key] || (letter ? letter.charCodeAt(0) : 0),
      bubbles: true,
      cancelable: true
    });

    document.dispatchEvent(event);
    window.dispatchEvent(new KeyboardEvent(type, {
      key: key,
      code: codeMap[letter] || codeMap[key] || key,
      bubbles: true,
      cancelable: true
    }));
  }

  function pressControl(button, pointerId) {
    if (activePointers.has(pointerId)) return;

    const key = button.dataset.key;
    activePointers.set(pointerId, { key, button });
    button.classList.add("pressed");

    if (![...activePointers.values()].some(
      item => item.key === key && item.button !== button
    )) {
      sendKey(key, "keydown");
    }
  }

  function releaseControl(pointerId) {
    const item = activePointers.get(pointerId);
    if (!item) return;

    activePointers.delete(pointerId);
    item.button.classList.remove("pressed");

    const stillHeld = [...activePointers.values()].some(
      active => active.key === item.key
    );

    if (!stillHeld) {
      sendKey(item.key, "keyup");
    }
  }

  function releaseAllControls() {
    const keys = new Set();

    for (const item of activePointers.values()) {
      keys.add(item.key);
      item.button.classList.remove("pressed");
    }

    activePointers.clear();

    for (const key of keys) {
      sendKey(key, "keyup");
    }
  }

  document.querySelectorAll(".touchButton").forEach(button => {
    button.addEventListener("contextmenu", event => {
      event.preventDefault();
    });

    button.addEventListener("pointerdown", event => {
      event.preventDefault();

      try {
        button.setPointerCapture(event.pointerId);
      } catch (_) {}

      pressControl(button, event.pointerId);
    });

    button.addEventListener("pointerup", event => {
      event.preventDefault();
      releaseControl(event.pointerId);
    });

    button.addEventListener("pointercancel", event => {
      releaseControl(event.pointerId);
    });

    button.addEventListener("lostpointercapture", event => {
      releaseControl(event.pointerId);
    });
  });

  window.addEventListener("blur", releaseAllControls);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) releaseAllControls();
  });

  fullscreenButton.addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        await gameWrapper.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      setStatus("Fullscreen could not be started in this browser.");
    }
  });

  document.addEventListener("fullscreenchange", () => {
    fullscreenButton.textContent = document.fullscreenElement
      ? "Exit Fullscreen"
      : "Fullscreen";
  });

  backButton.addEventListener("click", () => {
    window.location.href = "../index.html";
  });

  startButton.addEventListener("click", async () => {
    if (loading) return;

    if (!selectedWad) {
      setStatus("Choose your WAD file first.");
      wadPicker.click();
      return;
    }

    if (engineStarted) {
      setStatus("The engine has already started. Refresh the page to load a different WAD.");
      return;
    }

    loading = true;
    startButton.disabled = true;
    setStatus("Loading " + selectedWad.name + "...");
    consoleBox.textContent = "Starting Dwasm...\n";

    try {
      const wadBytes = new Uint8Array(await selectedWad.arrayBuffer());

      /*
       * Keep the existing Dwasm engine files in this same directory.
       * The selected WAD is written into Emscripten's virtual filesystem
       * before PrBoomX starts.
       */
      window.Module = {
        canvas: gameCanvas,
        arguments: ["-iwad", "/doom.wad"],

        print: function(text) {
          log(text);
        },

        printErr: function(text) {
          log(text);
        },

        locateFile: function(path) {
          return path;
        },

        preRun: [function() {
          if (typeof FS === "undefined") {
            throw new Error("Dwasm filesystem is not available.");
          }

          FS.writeFile("/doom.wad", wadBytes);
          log("WAD copied into the virtual filesystem.");
        }],

        onRuntimeInitialized: function() {
          engineStarted = true;
          loading = false;
          startButton.disabled = false;
          setStatus("DOOM loaded. Click the game and play!");
          gameWrapper.focus();
        },

        onAbort: function(reason) {
          loading = false;
          startButton.disabled = false;
          setStatus("Dwasm stopped: " + reason);
          log("Engine aborted: " + reason);
        }
      };

      const script = document.createElement("script");
      script.src = "index.js";
      script.async = true;

      script.onload = function() {
        log("Dwasm engine script loaded.");
      };

      script.onerror = function() {
        loading = false;
        startButton.disabled = false;
        setStatus("Could not load index.js. Check that the Dwasm files are in the doom folder.");
        log("ERROR: Failed to load index.js.");
      };

      document.body.appendChild(script);
    } catch (error) {
      loading = false;
      startButton.disabled = false;
      setStatus("Could not read the selected WAD: " + error.message);
      log("WAD loading error: " + error.message);
    }
  });
})();
</script>

</body>
</html>
