<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOOM | Classroom Arcade</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;

    }
  </style>
</head>

<body>
  <h1>DOOM</h1>
  <p>Classroom Arcade | Dwasm Web Player</p>

  <div class="toolbar">
    <label class="file-label" for="wadFile">Choose DOOM WAD</label>
    <input id="wadFile" type="file" accept=".wad,.WAD">

    <button id="fullscreenButton" type="button">⛶ Fullscreen</button>
  </div>

  <p id="status">Choose your DOOM.WAD or DOOM2.WAD to start.</p>

  <div id="gameWrapper">
    <canvas id="game" width="640" height="480"></canvas>
  </div>

  <pre id="console"></pre>

  <script>
    const wadInput = document.getElementById("wadFile");
    const statusText = document.getElementById("status");
    const canvas = document.getElementById("game");
    const wrapper = document.getElementById("gameWrapper");
    const consoleOutput = document.getElementById("console");
    const fullscreenButton = document.getElementById("fullscreenButton");

    let engineStarted = false;

    function log(message) {
      consoleOutput.textContent += String(message) + "\n";
    }

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await wrapper.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        statusText.textContent = "Fullscreen error: " + error.message;
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent = document.fullscreenElement
        ? "⛶ Exit Fullscreen"
        : "⛶ Fullscreen";

      window.dispatchEvent(new Event("resize"));
    });

    wadInput.addEventListener("change", async () => {
      const file = wadInput.files && wadInput.files[0];
      if (!file) return;

      if (!file.name.toLowerCase().endsWith(".wad")) {
        statusText.textContent = "Please select a .wad file.";
        return;
      }

      if (engineStarted) {
        statusText.textContent =
          "Reload the page before selecting a different WAD.";
        return;
      }

      try {
        const bytes = await file.arrayBuffer();
        startDwasm(bytes, file.name);
      } catch (error) {
        statusText.textContent = "Could not read WAD: " + error.message;
      }
    });

    function startDwasm(bytes, filename) {
      engineStarted = true;
      statusText.textContent = "Starting DOOM with " + filename + "...";
      log("Selected WAD: " + filename);

      const wadBytes = new Uint8Array(bytes);

      window.Module = {
        canvas: canvas,
        arguments: ["-iwad", "/doom.wad"],

        print: function (message) {
          log(message);
        },

        printErr: function (message) {
          log("ERROR: " + message);
        },

        setStatus: function (message) {
          if (message) statusText.textContent = message;
        },

        locateFile: function (path) {
          return "./" + path;
        },

        /*
         * IMPORTANT:
         * Do not use Module.FS here. Your Dwasm build does not expose
         * its filesystem on Module at this stage. Wait for the engine's
         * filesystem API to become available before writing the WAD.
         */
        preRun: [
          function () {
            const module = window.Module;

            if (module.FS && typeof module.FS.writeFile === "function") {
              module.FS.writeFile("/doom.wad", wadBytes);
              log("WAD copied into the engine filesystem.");
              return;
            }

            /*
             * Some Emscripten builds expose FS globally.
             * If neither API exists, stop with a clear diagnostic.
             */
            if (window.FS && typeof window.FS.writeFile === "function") {
              window.FS.writeFile("/doom.wad", wadBytes);
              log("WAD copied into the engine filesystem.");
              return;
            }

            log("This Dwasm build does not expose FS through Module or window.");
            log("The engine's index.js must be adjusted to accept a local WAD.");
            throw new Error("Dwasm filesystem API is not exposed.");
          }
        ],

        onRuntimeInitialized: function () {
          statusText.textContent = "DOOM engine initialized.";
        },

        onAbort: function (reason) {
          statusText.textContent = "DOOM stopped: " + reason;
          log("Engine aborted: " + reason);
        }
      };

      const script = document.createElement("script");
      script.src = "./index.js";

      script.onload = function () {
        log("Dwasm engine script loaded.");
      };

      script.onerror = function () {
        engineStarted = false;
        statusText.textContent =
          "Could not load index.js. Check that index.js, index.data, and index.wasm exist in this folder.";
      };

      document.body.appendChild(script);
    }
  </script>
</body>
</html>
